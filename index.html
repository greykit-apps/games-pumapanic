function renderRuleRow(key, def) {
  const val = houseRules[key];
  const step = def.step || 1;
  const displayVal = def.labels ? def.labels[val - def.min] : val + (def.unit || "");
  if (def.toggle) {
    const isOn = val > 0;
    return `
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div>
          <span style="color:var(--dim);font-size:12px;">${def.label}</span>
          <div style="font-size:9px;color:var(--dim);margin-top:1px;">${def.desc}</div>
        </div>
        <button onclick="updateSlider('${key}', ${isOn ? 0 : 1}); showMainMenu();"
          style="padding:3px 12px;font-family:var(--font-mono);font-size:11px;cursor:pointer;border-radius:3px;flex-shrink:0;
          border:1px solid ${isOn ? 'var(--green)' : 'var(--red)'};
          color:${isOn ? 'var(--green)' : 'var(--red)'};
          background:${isOn ? 'rgba(74,222,106,0.1)' : 'rgba(255,51,51,0.1)'};">${isOn ? 'ON' : 'OFF'}</button>
      </div>`;
  }
  return `
    <div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;">
        <span style="color:var(--dim)">${def.label}</span>
        <span style="color:var(--text);font-weight:bold;" id="slider-val-${key}">${displayVal}</span>
      </div>
      <input type="range" min="${def.min}" max="${def.max}" step="${step}" value="${val}"
        style="width:100%;" oninput="updateSlider('${key}', this.value)" aria-label="${def.label}">
      <div style="font-size:9px;color:var(--dim);margin-top:1px;">${def.desc}</div>
    </div>`;
}

function showMainMenu() {
  const content = document.getElementById("modal-content");
  content.dataset.dismissable = "true";
  content.dataset.help = "false";

  const presetBtns = Object.entries(DIFFICULTY_PRESETS).map(([id, p]) =>
    `<button class="action-btn" style="font-size:10px;padding:4px 10px;" onclick="applyPreset('${id}')">${p.label}</button>`
  ).join("");

  let baseHTML = "", addonHTML = "";
  for (const [key, def] of Object.entries(SLIDER_DEFS)) {
    if (def.hidden) continue;
    if (def.addon) addonHTML += renderRuleRow(key, def);
    else baseHTML += renderRuleRow(key, def);
  }

  content.innerHTML = `
    <h2>Custom game</h2>
    <div style="display:flex;gap:4px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;">
      ${presetBtns}
    </div>
    <div style="border-top:1px solid var(--line);padding-top:12px;">
      <h3 style="font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Base Rules</h3>
      <p style="font-size:9px;color:var(--dim);margin-bottom:10px;font-style:italic;">Standard is the full base game. Turning bosses or events off makes it easier.</p>
      ${baseHTML}
      <h3 style="font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin:12px 0 4px;">Add-ons</h3>
      <p style="font-size:9px;color:var(--dim);margin-bottom:10px;font-style:italic;">Extra rules layered on top of the base game. Off by default.</p>
      ${addonHTML}
    </div>
    <div class="modal-actions" style="margin-top:14px;">
      <button class="action-btn" onclick="closeModal(); newGame(); showTutorial();">Start Game</button>
      <button class="action-btn" style="opacity:0.7" onclick="closeModal();">Back</button>
    </div>
  `;
  openModal();
}

function showHowToPlay(tab) {
  const content = document.getElementById("modal-content");
  // If no game is running, closing help returns to the main menu
  content.dataset.dismissable = "true";
  content.dataset.help = "true";
  const activeTab = tab || "gameplay";

  function tabCls(id) { return id === activeTab ? "help-tab active" : "help-tab"; }
  function panelCls(id) { return id === activeTab ? "help-tab-content active" : "help-tab-content"; }

  content.innerHTML = `
    <h2>How to Play</h2>
    <div class="help-tabs">
      <button class="${tabCls("gameplay")}" onclick="showHowToPlay('gameplay')">Gameplay</button>
      <button class="${tabCls("cards")}" onclick="showHowToPlay('cards')">Cards</button>

let _prevFocus = null;
let _trapHandler = null;
function closeModal() {
  document.getElementById("modal-overlay").classList.remove("active");
  if (_trapHandler) {
    document.getElementById("modal-content").removeEventListener("keydown", _trapHandler);
    _trapHandler = null;
  }
  if (titleOpen) { _prevFocus = null; refreshTitle(); return; }
  if (_prevFocus) { _prevFocus.focus(); _prevFocus = null; }
}

function openModal() {
  if (!modalOpen()) _prevFocus = document.activeElement;
  document.getElementById("modal-overlay").classList.add("active");
  setTimeout(trapFocusInModal, 50);
}

function trapFocusInModal() {
  const modal = document.getElementById("modal-content");
  if (!modal || !modalOpen()) return;
  if (_trapHandler) modal.removeEventListener("keydown", _trapHandler);
  const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  first.focus();

  _trapHandler = function (e) {
    if (e.key !== "Tab") return;
    if (e.shiftKey) {
      if (document.activeElement === first) { e.preventDefault(); last.focus(); }
    } else {
      if (document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };
  modal.addEventListener("keydown", _trapHandler);
}

// Click outside modal content to close (only for help/non-essential modals)
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target === document.getElementById("modal-overlay")) {
    const content = document.getElementById("modal-content");
    if (content && content.dataset.dismissable === "true") {
      closeModal();
      deselect();
      if (G) updateAll();
    }
  }
});

/* ============================================================
   THE TABLE — the title's backdrop (games-meta STANDARD.md §15):
   the board lying on the table, a bot defending it. The bot keeps
   a game of its own and lends it to the engine as G only while a
   card is played, a threat moves or the board is drawn, with the
   log and the sounds held quiet -- so a game in progress, its log
   and the screen reader's announcements are never touched. Drawn
   by render() itself, so the board behind the title is the board
   you play on. The bot's game outlives the title: a dialog closing
   over it mounts the title again, and the bot plays on.
   ============================================================ */
let tableQuiet = false;
let table = null;          /* { P, stage, moves, spawns, next, over } */
function withTable(P, f) {
  const keepG = G, keepFx = flashEffects, keepSel = selectedCardIdx, keepHi = highlightedTargets;
  G = P; flashEffects = P.flashes; selectedCardIdx = null; highlightedTargets = []; tableQuiet = true;
  try { return f(); }
  finally { G = keepG; flashEffects = keepFx; selectedCardIdx = keepSel; highlightedTargets = keepHi; tableQuiet = false; }
}
/* A game set up as newGame sets one up, under the player's rules. */
function tableGame() {
  const cfg = resolveConfig();
  const P = {
    phase: "play", turn: 1, houseRules: { ...houseRules }, diffConfig: cfg,
    cardDeck: shuffle(buildCardDeck(cfg)), cardDiscard: [], hand: [],
    threatDeck: shuffle(buildThreatDeck(cfg)), threats: [],
    firewalls: Array(6).fill(1), fortified: null, servers: Array(6).fill(true),
    nextThreatId: 1, slain: 0, discardsUsed: 0, fwTargets: null, log: [], flashes: [],
  };
  withTable(P, () => {
    const pool = shuffle(["scriptKiddie", "scriptKiddie", "malware", "malware", "apt", "apt"]);
    for (let i = 0; i < cfg.startingThreats; i++) {
      const t = makeThreat(pool[i % pool.length], 1, rollArc());
      t.animScale = 0.1;
      P.threats.push(t);
    }
  });
  return { P, stage: "draw", moves: [], spawns: 0, next: 0, over: false };
}
/* The bot's next card, or null when none would help: the threat nearest
   the Core first, a kill before a hit; Quarantine and Honeypot only for a
   threat at the firewall; a slay kept for a threat a hit will not finish. */
function tableChoice(P) {
  let best = null;
  const offer = (score, c) => { if (score > 0 && (!best || score > best.score)) best = { score, ...c }; };
  P.hand.forEach((card, i) => {
    const def = CARD_TYPES[card.type];
    if (def.kind === "draw") return offer(1, { i });
    if (def.kind === "fortify") {
      if (P.fortified !== null) return;
      const arc = liveThreats().filter(t => t.ring === 3 && P.firewalls[t.arc]).map(t => t.arc)[0];
      if (arc !== undefined) offer(25, { i, arc });
      return;
    }
    for (const tg of getValidTargets(card)) {
      const t = P.threats.find(x => x.id === tg.threatId);
      const near = t.ring * 10;
      if (def.kind === "hit") offer(near + (def.damage >= t.hp ? 8 : 4), { i, t });
      else if (def.kind === "slay") offer(near + (t.hp > 1 ? 7 : 1), { i, t });
      else if (def.kind === "push" && t.ring >= 3) offer(near + 5, { i, t });
      else if (def.kind === "hold" && t.ring >= 3 && !t.honeypotted) offer(near + 2, { i, t });
    }
  });
  return best;
}
function tablePlay(P, c) {
  const card = P.hand.splice(c.i, 1)[0], def = CARD_TYPES[card.type], t = c.t;
  P.cardDiscard.push(card);
  const mark = colour => { const p = getThreatPos(t); addFlash(p.x, p.y, colour, 18); t.animFlash = 0.8; };
  if (def.kind === "hit") damageThreat(t, def.damage, def.name);
  else if (def.kind === "slay") damageThreat(t, t.hp, def.name);
  else if (def.kind === "push") { t.ring = 0; t.honeypotted = false; mark("#54f2ff"); }
  else if (def.kind === "hold") { t.honeypotted = true; mark("#ffb000"); }
  else if (def.kind === "draw") { drawCard(); drawCard(); }
  else if (def.kind === "fortify") {
    P.fortified = c.arc;
    const a = (c.arc + 0.5) * ARC_ANGLE - Math.PI / 2;
    addFlash(CENTER + Math.cos(a) * FIREWALL_RADIUS, CENTER + Math.sin(a) * FIREWALL_RADIUS, "#ffaa00", 25);
  }
}
/* One beat of the bot's turn, as the game plays one: draw, a card at a time,
   the threats advance one by one, the tokens come in. Returns the wait before
   the next beat, in ms. */
function tableStep(T) {
  const P = T.P;
  return withTable(P, () => {
    if (P.servers.every(s => !s) || (!P.threatDeck.length && !liveThreats().length)) { T.over = true; return 2400; }
    if (T.stage === "draw") {
      while (P.hand.length < P.diffConfig.handSize && drawCard()) { /* to a full hand */ }
      /* the turn's one discard: a card the bot never plays */
      const dud = P.hand.findIndex(c => ["build", "scavenge", "dead"].includes(CARD_TYPES[c.type].kind));
      if (dud >= 0) { P.cardDiscard.push(P.hand.splice(dud, 1)[0]); drawCard(); }
      T.stage = "play";
      return 700;
    }
    if (T.stage === "play") {
      const c = tableChoice(P);
      if (c) { tablePlay(P, c); return 1000; }
      T.moves = liveThreats().sort((a, b) => b.ring - a.ring || a.id - b.id).map(t => t.id);
      T.stage = "advance";
      return 600;
    }
    if (T.stage === "advance") {
      while (T.moves.length) {
        const t = P.threats.find(x => x.id === T.moves[0]);
        T.moves.shift();
        if (t && !t.dying) { resolveMove(t); return 420; }
      }
      T.stage = "spawn";
      T.spawns = P.diffConfig.tokensPerSpawn;
      return 500;
    }
    /* spawn: the tokens, one at a time; an event token's draws are kept,
       its other effects left to the game itself */
    const token = T.spawns > 0 ? drawThreatToken() : null;
    if (!token) { T.stage = "draw"; P.turn++; return 600; }
    T.spawns--;
    if (token.kind === "effect") { T.spawns += EFFECT_TYPES[token.type].extraDraws || 0; return 300; }
    const d = THREAT_TYPES[token.type];
    if (d.onSpawn === "draw3") T.spawns += 3;
    if (d.onSpawn === "draw4") T.spawns += 4;
    if (d.onSpawn === "heal") for (const o of P.threats) if (!o.dying && o.hp < o.maxHp) { o.hp++; o.animFlash = 0.6; }
    const t = makeThreat(token.type, 0, rollArc());
    t.animScale = 0.1;
    P.threats.push(t);
    return 600;
  });
}
/* The board's motion, a frame at a time, and the dead taken off it. */
function tableMotion(P) {
  animateBoard(P, P.flashes);
  for (const t of P.threats) if (t.hp <= 0 && !t.dying) { t.dying = true; t.animScale = 0; }
  P.threats = P.threats.filter(t => !t.dying || t.animScale > 0);
}
function titleBoard(el) {
  if (!el) return;
  const cv = document.createElement("canvas");
  cv.className = "pp-table";
  el.appendChild(cv);
  const g = cv.getContext("2d"), still = reduced();
  if (!table || table.over) { table = tableGame(); table.next = performance.now() + 900; }
  /* still: a few turns in at once, everything where it ends up */
  if (still) {
    for (let i = 0; i < 60 && !table.over; i++) tableStep(table);
    for (let i = 0; i < 60; i++) tableMotion(table.P);
  }
  let dpr = 0, last = 0, acc = 0;
  const frame = t => {
    if (!cv.isConnected) return;
    const d = Math.min(2, window.devicePixelRatio || 1);
    if (d !== dpr) { dpr = d; cv.width = cv.height = CANVAS_SIZE * dpr; }
    if (!still) {
      if (t >= table.next) {
        const wait = tableStep(table);
        if (table.over) { table = tableGame(); }
        table.next = t + wait;
      }
      /* the game's motion runs at its 16 ms tick, whatever the display's rate */
      acc = Math.min(acc + (last ? t - last : 16), 100);
      last = t;
      for (; acc >= 16; acc -= 16) tableMotion(table.P);
    }
    withTable(table.P, () => {
      const keep = ctx;
      ctx = g;
      try { g.setTransform(dpr, 0, 0, dpr, 0, 0); render(); } finally { ctx = keep; }
    });
    if (!still) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* The title's Sound switch, top right: the same switch as the header's,
   Settings' and M's. */
let titleSwitches = null, introDone = false;
function titleToggles() {
  return { sound: { get: () => !_muted, set: on => { if (on === _muted) toggleMute(); } } };
}
/* The game's AudioContext, made if need be but not woken: the intro's
   continue press is what lets it play. */
function titleAudio() {
  if (!_audioCtx) try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  return _audioCtx;
}
/* The table's sounds, under the Sound switch like every other effect. */
function titleSfx(fn, gain) {
  if (_muted) return;
  const ac = titleAudio();
  if (ac) try { fn(ac, ac.destination, { gain }); } catch (e) { /* audio is a nicety, never a failure */ }
}

/* ============================================================
   TITLE — the greykit.games Tactical canon. Resume game (a game
   live in this tab), New quick game (a game at once with the rules
   as they stand), Custom game (presets and rules), Settings, Help,
   About. PumaPanic keeps no save, so Resume is only ever the game
   left with Menu.
   ============================================================ */
injectTitleCSS();
const TITLE_NAME = "PumaPanic";
let titleOpen = false;
function liveGame() { return G && G.phase !== "gameover"; }
function rulesName() {
  for (const id in DIFFICULTY_PRESETS) {
    const p = DIFFICULTY_PRESETS[id].sliders;
    if (Object.keys(p).every(k => p[k] === houseRules[k])) return DIFFICULTY_PRESETS[id].label;
  }
  return "Custom rules";
}
function titleCfg() {
  const live = liveGame();
  return {
    name: TITLE_NAME,
    lines: ["Puma", "Panic"],
    sub: "Hold the Core",
    scene: true,
    primary: live ? "resume" : "quick",
    items: [
      live && { act: "resume", label: "Resume game", key: "R", meta: `Turn ${G.turn}` },
      { act: "quick", label: "New quick game", key: "N", meta: rulesName() },
      { act: "custom", label: "Custom game", key: "C", meta: "rules, add-ons" },
      "gap",
      { act: "settings", label: "Settings", key: "S" },
      { act: "help", label: "Help", key: "?" },
      { act: "about", label: "About", key: "A" },
    ],
  };
}
function openTitle() {
  titleOpen = true;
  const el = document.getElementById("title");
  el.innerHTML = titleHTML(titleCfg());
  el.hidden = false;
  /* The table (games-meta STANDARD.md §15). On the first load the intro's
     finish() lays out the credit and the Sound switch; every title after
     that does it here. */
  const t = el.querySelector(".gk-title");
  titleBoard(t.querySelector(".scene"));
  if (introDone) titleSwitches = gkIntegrate(t, { toggles: titleToggles(), tick: () => titleSfx(gktFlick, 0.3) });
  gkTable(t, {
    box: ["1 player", "6 servers to hold", "49 tokens"],
    tilt: true,
    /* not playing cards: the hand is a rank of firewalls, the block the
       board draws, its top and right side bevelled away */
    pieces: "tiles",
    shape: "polygon(0 12%,23% 0,100% 0,100% 88%,77% 100%,0 100%)",
    deal: () => titleSfx(gktPlace, 0.4),
    chit: () => titleSfx(gktChit, 0.3),
  });
  document.body.classList.add("on-title");
}
function closeTitle() {
  if (!titleOpen) return;
  titleOpen = false;
  const el = document.getElementById("title");
  el.hidden = true;
  el.innerHTML = "";
  document.body.classList.remove("on-title");
}
function toTitle() { closeModal(); openTitle(); revealTitle(); }
/* a dialog closing over the title redraws it: the quick game follows the rules */
function refreshTitle() { openTitle(); const b = document.querySelector("#title .gk-primary"); if (b) b.focus({ preventScroll: true }); }
function titleAct(a) {
  if (a === "resume") { if (liveGame()) { closeTitle(); updateAll(); } return; }
  if (a === "quick") {
    if (liveGame()) {
      const c = document.getElementById("modal-content");
      c.dataset.dismissable = "true"; c.dataset.help = "false";
      c.innerHTML = `<h2>New quick game</h2><p style="text-align:center;">Start a new game? The game in progress will be lost.</p>
        <div class="modal-actions"><button class="action-btn" onclick="closeModal(); newGame(); showTutorial();">Start a new game</button><button class="action-btn" style="opacity:0.7" onclick="closeModal();">Cancel</button></div>`;
      openModal();
    } else { newGame(); showTutorial(); }
    return;
  }
  if (a === "custom") { showMainMenu(); return; }
  if (a === "settings") { showSettings(); return; }
  if (a === "help") { showHowToPlay(); return; }
  if (a === "about") {
    const c = document.getElementById("modal-content");
    c.dataset.dismissable = "true"; c.dataset.help = "false";
    c.innerHTML = `<h2>About</h2>
      <p style="text-align:center;">PumaPanic: Based on the board game Castle Panic by Justin De Witt (2009). Developed entirely with Claude Code.</p>
      <p class="gk-credit" style="text-align:center;">Built by <a href="https://greykit.com/" target="_blank" rel="noopener">greykit.com</a></p>
      <div class="modal-actions"><button class="action-btn" onclick="closeModal();">Close</button></div>`;
    openModal();
  }
}
function showSettings() {
  const c = document.getElementById("modal-content");
  c.dataset.dismissable = "true"; c.dataset.help = "false";
  const pill = (on, label, flip) => `<button class="action-btn" style="font-size:10px;padding:4px 10px;${on ? "border-color:var(--accent);color:var(--accent);" : ""}" aria-pressed="${on}" onclick="${flip ? "toggleMute(); " : ""}showSettings();">${label}</button>`;
  c.innerHTML = `<h2>Settings</h2>
    <h3 style="font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Sound</h3>
    <div style="display:flex;gap:4px;justify-content:center;margin-bottom:8px;">${pill(!_muted, "On", _muted)}${pill(_muted, "Off", !_muted)}</div>
    <p style="font-size:10px;color:var(--dim);text-align:center;">The speaker in the game's header switches it too.</p>
    <h3 style="font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">This browser</h3>
    <div style="display:flex;gap:4px;justify-content:center;margin-bottom:8px;"><button class="action-btn" style="font-size:10px;padding:4px 10px;" onclick="confirmForget();">Forget everything</button></div>
    <p style="font-size:10px;color:var(--dim);text-align:center;">Clears everything PumaPanic keeps in this browser: that you have seen the tutorial. A game in progress ends.</p>
    <div class="modal-actions"><button class="action-btn" onclick="closeModal();">Close</button></div>`;
  openModal();
}
function confirmForget() {
  const c = document.getElementById("modal-content");
  c.dataset.dismissable = "true"; c.dataset.help = "false";
  c.innerHTML = `<h2>Forget everything?</h2><p style="text-align:center;">Forget everything PumaPanic has saved in this browser, and end any game in progress? This cannot be undone.</p>
    <div class="modal-actions"><button class="action-btn" onclick="forgetEverything();">Forget everything</button><button class="action-btn" style="opacity:0.7" onclick="showSettings();">Cancel</button></div>`;
  openModal();
}
/* Settings' "Forget everything" (games-meta STANDARD.md): every key PumaPanic
   owns, found by its prefix so a key added later is not one this misses, and
   only those -- every game on greykit.com shares one origin, so one storage. */
function forgetEverything() {
  for (const area of ["localStorage", "sessionStorage"]) {
    try {
      const s = window[area];
      for (let i = s.length - 1; i >= 0; i--) {
        const k = s.key(i);
        if (k && k.startsWith("pumapanic")) s.removeItem(k);
      }
    } catch (e) { /* no storage */ }
  }
  location.reload();
}
/* The title's keys, ahead of the game's: true when the key is spent. A
   dialog over the title has the keys to itself. */
function titleKey(e) {
  if (modalOpen()) return false;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === "Enter" || k === " " || k === "Tab" || k === "Shift") return false;
  if (k === "m") { e.preventDefault(); toggleMute(); return true; }
  const menu = document.querySelector("#title .gk-menu"), hit = menu && titleKeyButton(menu, k);
  if (hit) { e.preventDefault(); titleAct(hit.dataset.act); return true; }
  if (menu) titleArrow(menu, e);
  return true;       /* the board is hidden: its keys wait */
}
document.getElementById("title").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b) titleAct(b.dataset.act);
});

/* ============================================================
   INIT
   ============================================================ */
function init() {
  canvas = document.getElementById("game-canvas");
  ctx = canvas.getContext("2d");
  setupInput();
  render();

  // Continuous render loop for animations
  setInterval(renderLoop, 16);

  console.log("%cPumaPanic", "color:#54f2ff;font-size:20px;font-weight:bold;font-family:monospace;");
  console.log("%cPumaPanic — greykit.com", "color:#dbe4fb;font-size:12px;font-family:monospace;");
  console.log("%cInspecting the source? That's the spirit. Never trust, always verify.", "color:#7d8aa8;font-size:11px;font-family:monospace;");

  /* Every load opens on the title, under the boot sequence. The integrated
     intro (games-meta STANDARD.md §14): canon's boot with the meow -- unless
     sound is off -- then the hold that lets sound play, then the table. */
  const intro = startIntro({ lines: [bootReloadLine(), "one file: nothing to fetch"], audio: titleAudio, bootSound: _muted ? false : gkBootSound });
  openTitle();
  intro.finish({
    more: ["perimeter up: 6 servers online"],
    title: document.querySelector("#title .gk-title"),
    name: "lines",
    /* much quicker than canon's (600, 700, 3000, 4200): the name is down
       within a second of the boot, and the hand starts landing as its last
       line does, with no pause between them (as PumaTriage's) */
    timing: { name: 0, step: 220, menu: 380, done: 1400 },
    toggles: titleToggles(),
    tick: () => titleSfx(gktFlick, 0.3),
    onContinue: () => { const ac = titleAudio(); if (ac && ac.state !== "running") ac.resume().catch(() => {}); },
  }).then(r => { titleSwitches = r.toggles; introDone = true; });
}

init();
</script>
