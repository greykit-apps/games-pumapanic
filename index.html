`;

function injectTableCSS() {
  if (!document.getElementById("gk-table-css")) document.head.insertAdjacentHTML("beforeend", '<style id="gk-table-css">' + TABLE_CSS + "</style>");
}

/**
 * Lay a mounted .gk-title out as the table. Call it after mountTitle and
 * before finish(); a title mounted again later takes it again.
 *   box     optional: the box's small print under the name, as
 *           ["2–5 players", "bots", "60 minutes"]
 *   tilt    true lays the game's scene (its canvas or svg) down on the table
 *           in perspective; leave it out for a scene already drawn that way
 *   pieces  "cards" (the default): a hand, fanned and dealt. "tiles", for a
 *           game with no cards in its box: pieces set down in a rank
 *   shape   with tiles, the piece's outline as a clip-path, as PumaHeart's
 *           base: "polygon(36% 0,64% 0,100% 42%,100% 100%,0 100%,0 42%)"
 *   deal()  optional: plays as each card is dealt (gktDeal) or each piece is
 *           set down (gktPlace), into the game's effects; left out, silent
 *   chit()  optional: plays as each counter drops (gktChit)
 * Arrow keys: left and right along the hand or the rank, down to the counters, up from
 * them to the card last held. §6's letter keys are mountTitle's, unchanged.
 */
function gkTable(title, { box = null, tilt = false, pieces = "cards", shape = null, deal = null, chit = null } = {}) {
  if (!title || title.classList.contains("gkt")) return;
  injectTableCSS();
  title.classList.add("gkt");
  const tiles = pieces === "tiles";
  if (tiles) title.classList.add("gkt-tiles");
  if (tiles && shape) title.style.setProperty("--gk-table-shape", shape);
  const menu = title.querySelector(".gk-menu");
  if (!menu) return;
  const cards = [...menu.children].filter(b => b.tagName === "BUTTON"), util = menu.querySelector(".gk-util");
  /* the fan: each card turned about its foot, and dropped along an arc; a
     rank of pieces stands straight */
  const mid = (cards.length - 1) / 2;
  cards.forEach((b, k) => {
    const d = tiles ? 0 : k - mid;
    b.style.setProperty("--a", (d * 4.5).toFixed(2) + "deg");
    b.style.setProperty("--y", (d * d * 5).toFixed(1) + "px");
    const kb = b.querySelector("kbd");
    if (kb) b.insertAdjacentHTML("beforeend", '<span class="gkt-ix" aria-hidden="true">' + escHTML(kb.textContent) + "</span>");
  });
  /* the lid: the name, the line under it and the box's small print, together */
  const h1 = title.querySelector("main > h1");
  if (h1) {
    const lid = document.createElement("div");
    lid.className = "gkt-lid";
    h1.before(lid);
    lid.append(h1, ...title.querySelectorAll("main > .gk-sub"));
    if (box && box.length) lid.insertAdjacentHTML("beforeend", '<ul class="gkt-box">' + box.map(s => "<li>" + escHTML(s) + "</li>").join("") + "</ul>");
  }
  const scene = title.querySelector(":scope > .scene");
  if (tilt && scene) scene.classList.add("gkt-tilt");

  /* the deal's sounds, as each card's animation and each counter's begins:
     a skipped entrance runs none, so it makes no sound */
  title.addEventListener("animationstart", ev => {
    const f = ev.animationName === "gkt-deal" || ev.animationName === "gkt-place" ? deal : ev.animationName === "gkt-drop" ? chit : null;
    if (f && !ev.pseudoElement) try { f(); } catch (e) { /* no sound */ }
  });

  /* the hand's arrows, ahead of mountTitle's, which walk a column */
  let held = null;
  menu.addEventListener("focusin", ev => { if (cards.includes(ev.target)) held = ev.target; });
  const ctl = new AbortController();
  window.addEventListener("keydown", ev => {
    if (!title.isConnected) return ctl.abort();
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const a = document.activeElement, k = cards.indexOf(a);
    const to = b => { if (!b) return; ev.preventDefault(); ev.stopPropagation(); b.focus(); };
    if (k >= 0) {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") to(cards[(k + (ev.key === "ArrowRight" ? 1 : -1) + cards.length) % cards.length]);
      else if (ev.key === "ArrowDown") to(util && util.querySelector("button"));
      else if (ev.key === "ArrowUp") { ev.preventDefault(); ev.stopPropagation(); }
    } else if (ev.key === "ArrowUp" && util && util.contains(a)) {
      to(held || menu.querySelector(":scope > .gk-primary") || cards[0]);
    }
  }, { capture: true, signal: ctl.signal });
}

/* a short noise burst, shaped by env(p) for p from 0 to 1, as a buffer */
function gktNoise(ac, secs, env) {
  const buf = ac.createBuffer(1, Math.max(1, ac.sampleRate * secs | 0), ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * env(i / d.length);
  const s = ac.createBufferSource();
  s.buffer = buf;
  return s;
}

/**
 * The hand's tick: a thumb running over a card's edge -- a short dry flick of
 * paper, for finish()'s tick. An effect, under the Sound switch.
 *   ac, out   the AudioContext and the node to play into
 *   gain      level (default 0.5)
 */
function gktFlick(ac, out, { gain = 0.5 } = {}) {
  if (!ac || ac.state !== "running") return;
  const t = ac.currentTime, n = gktNoise(ac, 0.028, p => Math.min(1, p * 14) * Math.pow(1 - p, 2.5));
  const hp = ac.createBiquadFilter(), pk = ac.createBiquadFilter(), g = ac.createGain();
  hp.type = "highpass";
  hp.frequency.value = 1800;
  pk.type = "peaking";
  pk.frequency.value = 4300;
  pk.Q.value = 1.4;
  pk.gain.value = 8;
  g.gain.value = gain;
  n.connect(hp);
  hp.connect(pk);
  pk.connect(g);
  g.connect(out);
  n.start(t);
}

/**
 * A card dealt: the swish of it crossing the cloth, then the snap as it lands,
 * timed to the deal's landing (.38 s after the card starts). For gkTable's deal.
 *   ac, out   the AudioContext and the node to play into
 *   gain      level (default 0.5)
 */
function gktDeal(ac, out, { gain = 0.5 } = {}) {
  if (!ac || ac.state !== "running") return;
  const t = ac.currentTime, land = t + 0.38, bus = ac.createGain();
  bus.gain.value = gain;
  bus.connect(out);
  /* the swish: noise rising and falling through a band that slides down */
  const sw = gktNoise(ac, 0.26, p => Math.pow(Math.sin(Math.PI * Math.pow(p, 0.7)), 2));
  const bp = ac.createBiquadFilter(), sg = ac.createGain();
  bp.type = "bandpass";
  bp.Q.value = 0.8;
  bp.frequency.setValueAtTime(5200, land - 0.26);
  bp.frequency.exponentialRampToValueAtTime(1600, land);
  sg.gain.value = 0.32;
  sw.connect(bp);
  bp.connect(sg);
  sg.connect(bus);
  sw.start(land - 0.26);
  /* the snap: a bright crack of paper on the cloth, and a soft thump under it */
  const sn = gktNoise(ac, 0.022, p => Math.pow(1 - p, 3)), hp = ac.createBiquadFilter(), ng = ac.createGain();
  hp.type = "highpass";
  hp.frequency.value = 1400;
  ng.gain.value = 0.7;
  sn.connect(hp);
  hp.connect(ng);
  ng.connect(bus);
  sn.start(land);
  const o = ac.createOscillator(), og = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(170, land);
  o.frequency.exponentialRampToValueAtTime(70, land + 0.06);
  og.gain.setValueAtTime(0.5, land);
  og.gain.exponentialRampToValueAtTime(0.0001, land + 0.07);
  o.connect(og);
  og.connect(bus);
  o.start(land);
  o.stop(land + 0.08);
}

/**
 * A piece set down on the cloth: a soft wooden knock, timed to the piece's
 * landing (.35 s after it starts). For gkTable's deal, with tiles.
 *   ac, out   the AudioContext and the node to play into
 *   gain      level (default 0.5)
 */
function gktPlace(ac, out, { gain = 0.5 } = {}) {
  if (!ac || ac.state !== "running") return;
  const t = ac.currentTime + 0.35, bus = ac.createGain();
  bus.gain.value = gain;
  bus.connect(out);
  const o = ac.createOscillator(), og = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(230, t);
  o.frequency.exponentialRampToValueAtTime(110, t + 0.07);
  og.gain.setValueAtTime(0.7, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  o.connect(og);
  og.connect(bus);
  o.start(t);
  o.stop(t + 0.1);
  /* the edge of it meeting the cloth: a dull tap of noise */
  const n = gktNoise(ac, 0.03, p => Math.pow(1 - p, 2.5)), lp = ac.createBiquadFilter(), ng = ac.createGain();
  lp.type = "lowpass";
  lp.frequency.value = 1900;
  ng.gain.value = 0.55;
  n.connect(lp);
  lp.connect(ng);
  ng.connect(bus);
  n.start(t);
}

/**
 * A counter set down: a hard little clack, and a smaller one as it settles.
 * For gkTable's chit.
 *   ac, out   the AudioContext and the node to play into
 *   gain      level (default 0.4)
 */
function gktChit(ac, out, { gain = 0.4 } = {}) {
  if (!ac || ac.state !== "running") return;
  const t0 = ac.currentTime + 0.12, bus = ac.createGain();
  bus.gain.value = gain;
  bus.connect(out);
  for (const [at, lvl] of [[0, 1], [0.055, 0.35]]) {
    const t = t0 + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(1350, t);
    o.frequency.exponentialRampToValueAtTime(820, t + 0.03);
    g.gain.setValueAtTime(0.6 * lvl, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    o.connect(g);
    g.connect(bus);
    o.start(t);
    o.stop(t + 0.045);
    const n = gktNoise(ac, 0.01, p => Math.pow(1 - p, 2)), bp = ac.createBiquadFilter(), ng = ac.createGain();
    bp.type = "bandpass";
    bp.frequency.value = 3200;
    bp.Q.value = 1.2;
    ng.gain.value = 0.8 * lvl;
    n.connect(bp);
    bp.connect(ng);
    ng.connect(bus);
    n.start(t);
  }
}
/* @gk-table-end */
</script>

  malware:      { name: "Malware",       glyph: "MW", hp: 2, color: "#ff6633", boss: false, sides: 4 },   // Orc — diamond

// Event tokens. The Castle Panic token each one mirrors is in the trailing comment.
const EFFECT_TYPES = {
  outagePerimeter: { name: "Outage: Perimeter", desc: "Perimeter team is down — discard every Perimeter card in your hand", plagueRing: 1 },   // Plague: Archers
  outageNetwork:   { name: "Outage: Network",   desc: "Network team is down — discard every Network card in your hand",     plagueRing: 2 },   // Plague: Knights

  coordinated:     { name: "Coordinated Attack", desc: "Draw 3 more tokens", extraDraws: 3 },                                                 // Draw 3 Monsters

  lateralCCW:      { name: "Lateral Movement ↺", desc: "Every threat shifts one segment counter-clockwise", shift: -1 },                  // Move Counter-clockwise
  // Add-on
  zeroDay:         { name: "Zero-Day Exploit",   desc: "Every threat in the Perimeter and Network rings surges 1 ring inward", addon: true },
};

// Base token deck: 49 tokens, mirroring the Castle Panic monster tokens.
// Counts are from memory of the base game — adjust here if your copy differs.
const BASE_TOKEN_MANIFEST = [
  ["threat", "scriptKiddie", 12],
  ["threat", "malware",      12],
  ["threat", "apt",          10],
  ["threat", "botnetCmd",     1],
  ["threat", "ransomware",    1],
  ["threat", "supplyChain",   1],
  ["effect", "outagePerimeter", 1],
  ["effect", "outageNetwork",   1],

  ["effect", "coordinated",     2],
  ["effect", "massCampaign",    1],
  ["effect", "lateralCW",       2],
  ["effect", "lateralCCW",      2],
];

/* ============================================================
   DIFFICULTY CONFIG — House Rules System
   The "Standard" preset is the base game. Everything under
   addon: true is an extra rule layered on top.
   ============================================================ */
const SLIDER_DEFS = {
  handSize:    { label: "Hand Size",         min: 4, max: 6, default: 6, unit: " cards", harder: false, desc: "Cards drawn each turn (base rule: 6 for a solo player)" },
  bosses:      { label: "Boss Threats",      min: 0, max: 1, default: 1, toggle: true, labels: ["Off", "On"], harder: true,  desc: "Botnet Cmdr, Ransomware and Supply Chain in the token deck" },
  events:      { label: "Event Tokens",      min: 0, max: 1, default: 1, toggle: true, labels: ["Off", "On"], harder: true,  desc: "Outages, DDoS, Coordinated Attack, Mass Campaign, Lateral Movement" },
  // Add-ons
  activeDef:   { label: "Active Defense",    min: 0, max: 2, default: 0, addon: true, harder: false, labels: ["Off", "+1 damage", "+2 damage"], desc: "Extra damage to a threat that hits a firewall or server (base rule: 1)" },
  escalation:  { label: "Escalation Cards",  min: 0, max: 1, default: 0, addon: true, toggle: true, labels: ["Off", "On"], harder: false, desc: "2 extra cards that deal 2 damage in the outer rings" },
  nationState: { label: "Nation State",      min: 0, max: 1, default: 0, addon: true, toggle: true, labels: ["Off", "On"], harder: true,  desc: "Extra 4 HP boss, immune to Perimeter cards (needs bosses on)" },
  zeroDay:     { label: "Zero-Day Exploits", min: 0, max: 1, default: 0, addon: true, toggle: true, labels: ["Off", "On"], harder: true,  desc: "2 extra event tokens: outer threats surge 1 ring (needs events on)" },
  misconfigs:  { label: "Misconfigurations", min: 0, max: 5, default: 0, addon: true, unit: " dead", harder: true, desc: "Dead cards shuffled into the deck" },
};

const DIFFICULTY_PRESETS = {
  easy:   { label: "Beginner", sliders: { handSize: 6, bosses: 0, events: 0, activeDef: 1, escalation: 1, nationState: 0, zeroDay: 0, misconfigs: 0 } },
  normal: { label: "Standard", sliders: { handSize: 6, bosses: 1, events: 1, activeDef: 0, escalation: 0, nationState: 0, zeroDay: 0, misconfigs: 0 } },
  hard:   { label: "Hard",     sliders: { handSize: 5, bosses: 1, events: 1, activeDef: 0, escalation: 0, nationState: 1, zeroDay: 1, misconfigs: 2 } },
};

// Active config — mutated by UI sliders
let houseRules = { ...DIFFICULTY_PRESETS.normal.sliders };

function resolveConfig() {
  const h = houseRules;
  return {
    handSize: h.handSize,
    bosses: !!h.bosses,
    events: !!h.events,
    activeDef: h.activeDef || 0,
    escalation: !!h.escalation,
    nationState: !!h.nationState && !!h.bosses,
    zeroDay: !!h.zeroDay && !!h.events,
    misconfigCards: h.misconfigs || 0,
    tokensPerSpawn: 2,
    startingThreats: 6,
  };
}

/* ============================================================
   DECK BUILDERS
   ============================================================ */
// Base deck: 49 cards, mirroring the Castle Panic deck.
// Counts are from memory of the base game — adjust here if your copy differs.
function buildCardDeck(cfg) {
  const deck = [];
  let uid = 1;
  const add = (type, n, extra) => { for (let i = 0; i < n; i++) deck.push({ type, ...(extra || {}), _uid: uid++ }); };
  // 3 of each ring card per segment pair (27)
  for (const ring of ["perimeterDef", "networkDef", "endpointDef"]) {
    for (let p = 0; p < 3; p++) add(ring, 3, { pairIdx: p });
  }
  // 1 any-segment card per ring (3)
  add("firewallRule", 1); add("networkACL", 1); add("hostPatch", 1);
  // 1 Incident Commander per segment pair (3)
  for (let p = 0; p < 3; p++) add("incidentCmd", 1, { pairIdx: p });
  // Specials (16)
  add("contractor", 1); add("sinkhole", 1); add("quarantine", 1); add("honeypot", 1); add("harden", 1);
  add("hardware", 4); add("config", 4); add("threatIntel", 2); add("forensics", 1);
  // Add-ons
  if (cfg.escalation) add("escalation", 2);
  add("misconfig", cfg.misconfigCards);
  return deck;
}

function buildThreatDeck(cfg) {
  const deck = [];
  for (const [kind, type, n] of BASE_TOKEN_MANIFEST) {
    if (kind === "threat" && THREAT_TYPES[type].boss && !cfg.bosses) continue;
    if (kind === "effect" && !cfg.events) continue;
    for (let i = 0; i < n; i++) deck.push({ kind, type });
  }
  // Add-ons
  if (cfg.nationState) deck.push({ kind: "threat", type: "nationState" });
  if (cfg.zeroDay) { deck.push({ kind: "effect", type: "zeroDay" }); deck.push({ kind: "effect", type: "zeroDay" }); }
  return deck;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ============================================================
   GAME STATE
   ============================================================ */
let G = null; // game state
let canvas, ctx;
let selectedCardIdx = null;
let highlightedTargets = []; // [{ring, arc, threatId}]
let animating = false;  // true while the event queue is processing
let inputLock = false;  // true while a card is animating out of the hand

// Animation state
let eventQueue = [];
let flashEffects = []; // {x, y, color, radius, life, maxLife}
let queueTimer = null;   // pending processEventQueue timeout
let pendingTimer = null; // pending phase-transition timeout

// Drop every in-flight animation and timer so a new game starts clean.
function resetRuntime() {
  eventQueue = [];
  animating = false;
  inputLock = false;
  flashEffects = [];
  if (queueTimer) { clearTimeout(queueTimer); queueTimer = null; }
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
}

function rollArc() { return Math.floor(Math.random() * NUM_ARCS); }

function makeThreat(type, ring, arc) {
  const d = THREAT_TYPES[type];
  return {
    id: G.nextThreatId++,
    type, ring, arc,
    hp: d.hp, maxHp: d.hp,
    honeypotted: false,
    immunePerimeter: !!d.immunePerimeter,
    animRing: ring, animScale: 1, animFlash: 0,
  };
}

function newGame(presetId) {
  closeTitle();
  if (presetId && DIFFICULTY_PRESETS[presetId]) {
    houseRules = { ...DIFFICULTY_PRESETS[presetId].sliders };
  }
  resetRuntime();
  const cfg = resolveConfig();

  G = {
    phase: "draw",       // draw, discard, play, advance, spawn, gameover
    turn: 0,
    houseRules: { ...houseRules },
    diffConfig: cfg,
    cardDeck: shuffle(buildCardDeck(cfg)),
    cardDiscard: [],
    hand: [],
    threatDeck: shuffle(buildThreatDeck(cfg)),
    threats: [],         // see makeThreat
    firewalls: Array(6).fill(1), // 1 = standing, 0 = destroyed — a firewall falls in one hit
    fortified: null,     // arc index of the one Hardened firewall, if any
    servers:   [true, true, true, true, true, true],
    nextThreatId: 1,
    slain: 0,
    discardsUsed: 0,
    fwTargets: null,     // {mode: "fortify"|"build", arcs: [...], partnerIdx}
    log: [],
  };

  const list = document.getElementById("log-list");
  if (list) list.innerHTML = "";
  prevHUDState = {};
  prevPhase = null;

  // Setup: 2 Script Kiddies, 2 Malware, 2 APTs in the Perimeter ring, each at a rolled segment
  const setupPool = shuffle(["scriptKiddie", "scriptKiddie", "malware", "malware", "apt", "apt"]);
  for (let i = 0; i < cfg.startingThreats; i++) {
    const t = makeThreat(setupPool[i % setupPool.length], 1, rollArc());
    t.animScale = 0.1;
    G.threats.push(t);
  }

  G.turn = 1;
  selectedCardIdx = null;
  highlightedTargets = [];

  log("=== TURN 1 ===");
  log("Threats detected on the perimeter. Draw your hand.");

  doDrawPhase();
}

function drawCard() {
  if (G.cardDeck.length === 0) {
    if (G.cardDiscard.length === 0) return false;
    G.cardDeck = shuffle([...G.cardDiscard]);
    G.cardDiscard = [];
    log("Card deck reshuffled from discards.");
  }
  const card = G.cardDeck.pop();
  G.hand.push(card);
  return true;
}

function drawThreatToken() {
  if (G.threatDeck.length === 0) return null;
  return G.threatDeck.pop();
}

function liveThreats() { return G.threats.filter(t => !t.dying); }

/* ============================================================
   ANIMATION & EVENT QUEUE
   ============================================================ */

/* One frame of the board's motion: threats glide between rings, pop in,
   shrink out and flash, and the flashes fade. The game's board and the
   title's table both run it. true when anything moved. */
function animateBoard(S, fx) {
  // Lerp animRing toward ring for all threats
  let needsRedraw = false;
  for (const t of S.threats) {
    if (t.animRing !== undefined && Math.abs(t.animRing - t.ring) > 0.01) {
      t.animRing += (t.ring - t.animRing) * 0.15;
      if (Math.abs(t.animRing - t.ring) < 0.02) t.animRing = t.ring;
      needsRedraw = true;
    }
    // Dying threats shrink
    if (t.dying) {
      t.animScale = Math.max(0, (t.animScale || 1) - 0.08);
      needsRedraw = true;
    }
    // Scale animation (spawn pop-in) — only for non-dying
    else if (t.animScale !== undefined && t.animScale < 1) {
      t.animScale = Math.min(1, t.animScale + 0.08);
      needsRedraw = true;
    }
    // Flash decay
    if (t.animFlash > 0) {
      t.animFlash = Math.max(0, t.animFlash - 0.06);
      needsRedraw = true;
    }
  }

  // Flash effects decay
  for (let i = fx.length - 1; i >= 0; i--) {
    fx[i].life -= 0.04;
    if (fx[i].life <= 0) {
      fx.splice(i, 1);
    }
    needsRedraw = true;
  }
  return needsRedraw;
}

function renderLoop() {
  if (!G) return;

  let needsRedraw = animateBoard(G, flashEffects);

  // Safety: flag any 0-HP threats that weren't marked dying
  for (const t of G.threats) {
    if (t.hp <= 0 && !t.dying) {
      t.dying = true;
      t.animScale = 0; // instant remove
      G.slain++;
    }
  }

  // Remove fully shrunk threats
  const before = G.threats.length;
  G.threats = G.threats.filter(t => !t.dying || t.animScale > 0);
  if (G.threats.length !== before) { needsRedraw = true; updateHUD(); }

  if (needsRedraw || animating) {
    render();
  }
}

function addFlash(x, y, color, radius) {
  flashEffects.push({ x, y, color, radius, life: 1, maxLife: 1 });
}

// Slide a card out of the hand. The card must already be removed from G.hand;
// its DOM element is still on screen until the callback rebuilds the hand.
function animateCardOut(card, mode, callback) {
  const container = document.getElementById("card-hand");
  const targetEl = card && card._uid
    ? container.querySelector(`.card[data-card-id="${card._uid}"]`)
    : null;

  if (targetEl) {
    const cls = mode === "discard" ? "card-exit-discard" : "card-exit-play";
    targetEl.classList.add(cls);
    targetEl.style.pointerEvents = "none";
    if (mode === "discard") sfxCardDiscard(); else sfxCardPlay();
    inputLock = true;
    setTimeout(() => { inputLock = false; callback(); }, 280);
  } else {
    callback();
  }
}

function screenPulse(color, durationMs) {
  const el = document.getElementById("screen-pulse");
  if (!el) return;
  el.classList.remove("active");
  el.style.background = color;
  el.style.setProperty("--pulse-duration", (durationMs / 1000) + "s");
  // Force reflow to restart animation
  void el.offsetWidth;
  el.classList.add("active");
  setTimeout(() => el.classList.remove("active"), durationMs);
}

function processEventQueue() {
  queueTimer = null;
  if (!G) { animating = false; return; }
  if (eventQueue.length === 0) {
    animating = false;
    return;
  }

  animating = true;
  const evt = eventQueue.shift();

  switch (evt.type) {
    case "log":
      log(evt.msg);
      updateAll();
      break;

    case "move": {
      const t = G.threats.find(th => th.id === evt.threatId);
      if (t) resolveMove(t);
      updateAll();
      break;
    }

    case "spawn_threat": {
      const tDef = THREAT_TYPES[evt.threatType];
      if (tDef.boss) sfxBossSpawn(); else sfxThreatSpawn();
      const threat = makeThreat(evt.threatType, 0, evt.arc);
      threat.animScale = 0.1;
      threat.animFlash = 0.6;
      G.threats.push(threat);
      log(evt.msg);
      updateAll();
      break;
    }

    case "effect":
      log(evt.msg);
      sfxZeroDay();
      addFlash(CENTER, CENTER, evt.flashColor || "#ff6600", 200);
      updateAll();
      break;

    case "check_lose":
      if (G.servers.every(s => !s)) {
        G.phase = "gameover";
        animating = false;
        eventQueue = [];
        updateAll();
        setTimeout(() => showGameOver(false), 500);
        return; // stop processing queue
      }
      break;

    case "check_win":
      if (G.threatDeck.length === 0 && liveThreats().length === 0) {
        G.phase = "gameover";
        animating = false;
        eventQueue = [];
        updateAll();
        setTimeout(() => showGameOver(true), 500);
        return;
      }
      break;

    case "callback":
      if (evt.fn) evt.fn();
      break;
  }

  // Schedule next event
  const delay = evt.delay || 150;
  queueTimer = setTimeout(processEventQueue, delay);
}

function enqueueAndProcess(events) {
  eventQueue = events;
  animating = true;
  processEventQueue();
}

/* Sound (games-meta STANDARD.md §8): M or the header's Sound toggle, saved
   in this browser; the toggle is pressed while sound is on. */
const MUTED_KEY = "pumapanic_muted_v1";
let _muted = (() => { try { return localStorage.getItem(MUTED_KEY) === "1"; } catch (e) { return false; } })();
let _audioCtx = null;
(() => { const btn = document.getElementById("mute-btn"); if (btn) btn.setAttribute("aria-pressed", !_muted ? "true" : "false"); })();

function toggleMute() {
  _muted = !_muted;
  try { localStorage.setItem(MUTED_KEY, _muted ? "1" : "0"); } catch (e) { /* no storage */ }
  const btn = document.getElementById("mute-btn");
  if (btn) {
    btn.setAttribute("aria-pressed", !_muted ? "true" : "false");
  }
  if (titleOpen && titleSwitches) titleSwitches.refresh();
  // Resume audio context on first unmute (browser autoplay policy)
  if (!_muted && !_audioCtx) {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === "suspended") _audioCtx.resume();
  return _audioCtx;
}

function playTone(freq, type, duration, gain, delay) {
  if (_muted || tableQuiet) return;
  try {
    const ctx = getAudioCtx();
    const d = delay || 0;
    const osc = ctx.createOscillator();
    const vol = ctx.createGain();
    osc.connect(vol);
    vol.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + d);
    vol.gain.setValueAtTime(0, ctx.currentTime + d);
    vol.gain.linearRampToValueAtTime(gain, ctx.currentTime + d + 0.01);
    vol.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + duration);
    osc.start(ctx.currentTime + d);
    osc.stop(ctx.currentTime + d + duration + 0.05);
  } catch(e) {}
}

/* ============================================================
   TURN PHASES
   1 Draw up · 2 Discard & draw one · 3 Play cards · 4 Advance · 5 Spawn two tokens
   ============================================================ */
function doDrawPhase() {
  G.phase = "draw";
  G.discardsUsed = 0;
  const handSize = G.diffConfig ? G.diffConfig.handSize : 6;
  while (G.hand.length < handSize && (G.cardDeck.length > 0 || G.cardDiscard.length > 0)) {
    drawCard();
  }
  sfxDraw();
  // Auto-advance to discard phase
  G.phase = "discard";
  selectedCardIdx = null;
  highlightedTargets = [];
  G.fwTargets = null;
  updateAll();
}

function doDiscardCard(idx) {
  if (G.phase !== "discard" || inputLock || G.discardsUsed >= 1) return;
  const card = G.hand.splice(idx, 1)[0];
  if (!card) return;
  G.cardDiscard.push(card);
  G.discardsUsed++;
  drawCard();
  log(`Discarded ${getCardName(card)}, drew a new card.`);
  selectedCardIdx = null;
  G.phase = "play";
  animateCardOut(card, "discard", updateAll);
}

function skipDiscard() {
  if (G.phase !== "discard" || inputLock) return;
  G.phase = "play";
  selectedCardIdx = null;
  updateAll();
}

function endPlayPhase() {
  if (G.phase !== "play" || animating || inputLock) return;
  G.phase = "advance";
  deselect();
  updateAll();
  // Small delay then advance
  pendingTimer = setTimeout(doAdvancePhase, 400);
}

function deselect() {
  selectedCardIdx = null;
  highlightedTargets = [];
  if (G) G.fwTargets = null;
}

/* ============================================================
   PLAYING CARDS
   ============================================================ */
function selectCard(idx) {
  if (!G || inputLock || animating) return;
  if (G.phase === "discard") {
    doDiscardCard(idx);
    return;
  }
  if (G.phase !== "play") return;

  const card = G.hand[idx];
  if (!card) return;
  const def = CARD_TYPES[card.type];

  // Clicking the selected card again deselects it
  if (selectedCardIdx === idx) { deselect(); updateAll(); return; }
  deselect();

  switch (def.kind) {
    case "dead":
      log("Misconfigured cards do nothing. Discard one during the Discard phase.");
      updateAll();
      return;

    case "draw": {
      consumeCards([idx], "play");
      let n = 0;
      if (drawCard()) n++;
      if (drawCard()) n++;
      log(`Threat Intel: drew ${n} card${n === 1 ? "" : "s"}.`);
      return;
    }

    case "scavenge":
      if (G.cardDiscard.length === 0) {
        log("The discard pile is empty — nothing to recover.");
        updateAll();
        return;
      }
      selectedCardIdx = idx;
      updateAll();
      showScavengeModal();
      return;

    case "fortify": {
      const arcs = G.firewalls.map((fw, i) => (fw && G.fortified !== i) ? i : -1).filter(i => i >= 0);
      if (arcs.length === 0) {
        log("No standing firewall to harden.");
        updateAll();
        return;
      }
      selectedCardIdx = idx;
      G.fwTargets = { mode: "fortify", arcs };
      updateAll();
      return;
    }

    case "build": {
      const partnerIdx = G.hand.findIndex((c, i) => i !== idx && c.type === def.partner);
      if (partnerIdx < 0) {
        log(`${def.name} needs a ${CARD_TYPES[def.partner].name} card played with it to rebuild a firewall.`);
        updateAll();
        return;
      }
      const arcs = G.firewalls.map((fw, i) => (!fw && G.servers[i]) ? i : -1).filter(i => i >= 0);
      if (arcs.length === 0) {
        log("No destroyed firewall with a standing server behind it.");
        updateAll();
        return;
      }
      selectedCardIdx = idx;
      G.fwTargets = { mode: "build", arcs, partnerIdx };
      updateAll();
      return;
    }

    default: // hit, slay, push, hold — target a threat on the board
      selectedCardIdx = idx;
      highlightedTargets = getValidTargets(card);
      if (highlightedTargets.length === 0) log(`No valid target for ${getCardName(card)} right now.`);
      updateAll();
  }
}

function getValidTargets(card) {
  const def = CARD_TYPES[card.type];
  const targets = [];

  for (const t of G.threats) {
    if (t.ring === 0) continue;          // nothing reaches the Internet ring
    if (t.hp <= 0 || t.dying) continue;  // already dead, animating out

    let ringOk;
    if (def.ring === "any") ringOk = t.ring >= 1;
    else if (def.ring === "outer") ringOk = t.ring >= 1 && t.ring <= 3;
    else ringOk = t.ring === def.ring || (def.ring === 3 && t.ring === CORE_RING); // Endpoint cards also reach the Core
    if (!ringOk) continue;

    // Nation State add-on: immune to Perimeter-ring cards
    if (t.immunePerimeter && def.ring === 1) continue;

    if (def.segment === "pair" && card.pairIdx !== undefined) {
      if (!SEGMENT_PAIRS[card.pairIdx].includes(t.arc)) continue;
    }

    targets.push({ ring: t.ring, arc: t.arc, threatId: t.id });
  }
  return targets;
}

// Remove cards from the hand into the discard pile, animating the first one out.
function consumeCards(indices, mode) {
  const lead = G.hand[indices[0]]; // the card the player clicked
  const sorted = [...indices].sort((a, b) => b - a);
  const cards = sorted.map(i => G.hand.splice(i, 1)[0]).filter(Boolean);
  for (const c of cards) G.cardDiscard.push(c);
  deselect();
  animateCardOut(lead, mode || "play", updateAll);
}

// Apply damage to a threat and handle its death. Returns true if it died.
function damageThreat(threat, dmg, source) {
  const tDef = THREAT_TYPES[threat.type];
  threat.hp -= dmg;
  threat.animFlash = 1.0;
  const pos = getThreatPos(threat);
  addFlash(pos.x, pos.y, "#ffffff", 15);
  sfxHit();

  const where = `${ARCS[threat.arc].name}/${ringName(threat.ring)}`;
  if (threat.hp <= 0) {
    threat.hp = 0;
    threat.dying = true;
    threat.animScale = 1.0;
    G.slain++;
    sfxSlain();
    addFlash(pos.x, pos.y, tDef.color, 20);
    log(`${tDef.name} in ${where} SLAIN! (${source})`);
    return true;
  }
  log(`${source} hit ${tDef.name} in ${where} for ${dmg} (${threat.hp}/${threat.maxHp} HP left).`);
  return false;
}

function clickThreat(threatId) {
  if (G.phase !== "play" || selectedCardIdx === null || animating || inputLock) return;
  if (!highlightedTargets.find(t => t.threatId === threatId)) return;

  const idx = selectedCardIdx;
  const card = G.hand[idx];
  const def = CARD_TYPES[card.type];
  const threat = G.threats.find(t => t.id === threatId);
  if (!threat) return;
  const tName = THREAT_TYPES[threat.type].name;

  switch (def.kind) {
    case "hold":
      threat.honeypotted = true;
      log(`Honeypot deployed: ${tName} in ${ARCS[threat.arc].name} will not advance next turn.`);
      break;
    case "push": {
      const oldRing = threat.ring;
      threat.ring = 0;
      threat.animRing = oldRing;
      threat.honeypotted = false;
      log(`Quarantined ${tName} — sent back to the Internet.`);
      break;
    }
    case "slay":
      damageThreat(threat, threat.hp, getCardName(card));
      break;
    case "hit":
      damageThreat(threat, def.damage, getCardName(card));
      break;
  }

  consumeCards([idx], "play");
}

// Harden / Hardware+Config: the player clicked a highlighted firewall slot
function clickFirewall(arcIdx) {
  if (G.phase !== "play" || selectedCardIdx === null || animating || inputLock) return;
  const ft = G.fwTargets;
  if (!ft || !ft.arcs.includes(arcIdx)) return;

  const angle = (arcIdx + 0.5) * ARC_ANGLE - Math.PI / 2;
  const fx = CENTER + Math.cos(angle) * FIREWALL_RADIUS;
  const fy = CENTER + Math.sin(angle) * FIREWALL_RADIUS;

  if (ft.mode === "fortify") {
    G.fortified = arcIdx;
    log(`Firewall in ${ARCS[arcIdx].name} hardened — it now takes 2 hits.`);
    addFlash(fx, fy, "#4ade6a", 20);
    sfxHarden();
    consumeCards([selectedCardIdx], "play");
  } else if (ft.mode === "build") {
    G.firewalls[arcIdx] = 1;
    log(`Firewall in ${ARCS[arcIdx].name} rebuilt!`);
    addFlash(fx, fy, "#4ade6a", 20);
    sfxHarden();
    consumeCards([selectedCardIdx, ft.partnerIdx], "play");
  }
}

// Forensics: pick any card from the discard pile

function pickScavenge(discardIdx) {
  closeModal();
  if (!G || G.phase !== "play" || selectedCardIdx === null) return;
  const fIdx = selectedCardIdx;
  const forensics = G.hand[fIdx];
  if (!forensics || CARD_TYPES[forensics.type].kind !== "scavenge") return;
  const recovered = G.cardDiscard.splice(discardIdx, 1)[0];
  if (!recovered) return;
  G.hand.push(recovered);
  log(`Forensics recovered ${getCardName(recovered)} from the discard pile.`);
  consumeCards([fIdx], "play");
}

/* ============================================================
   ADVANCE PHASE — every threat moves one step toward the Core
   ============================================================ */
function doAdvancePhase() {
  pendingTimer = null;
  G.phase = "advance";
  updateAll();

  const queue = [];
  queue.push({ type: "log", msg: pick(FLAVOR.advance), delay: 300 });

  // Innermost threats move first, so a Core threat rotates before an Endpoint threat breaches.
  const order = liveThreats().sort((a, b) => b.ring - a.ring || a.id - b.id);
  for (const t of order) queue.push({ type: "move", threatId: t.id, delay: 320 });

  queue.push({ type: "check_lose", delay: 300 });
  queue.push({ type: "callback", fn: doSpawnPhase, delay: 400 });

  enqueueAndProcess(queue);
}

// Resolved at event time so each move sees the board as the previous move left it.
function resolveMove(t) {
  if (t.dying) return;
  const tName = THREAT_TYPES[t.type].name;

  if (t.honeypotted) {
    t.honeypotted = false;
    t.animFlash = 0.8;
    log(`${tName} in ${ARCS[t.arc].name} is stuck in the honeypot — did not advance.`);
    return;
  }

  if (t.ring < 3) {
    t.ring++;
    sfxAdvance();
    return;
  }

  if (t.ring === 3) {
    // At the Endpoint: hit the firewall, then the server, then slip into the Core
    if (G.firewalls[t.arc] || G.servers[t.arc]) { hitStructure(t, t.arc, false); return; }
    t.ring = CORE_RING;
    sfxAdvance();
    log(`${tName} slipped into the Core through ${ARCS[t.arc].name} — nothing left there to stop it.`);
    return;
  }

  // In the Core: rotate clockwise and hit whatever stands in the next segment
  t.arc = (t.arc + 1) % NUM_ARCS;
  if (G.firewalls[t.arc] || G.servers[t.arc]) hitStructure(t, t.arc, true);
  else log(`${tName} moved through the Core into ${ARCS[t.arc].name}.`);
}

// A threat damages the firewall (or, with no firewall, the server) in an arc,
// and takes 1 damage for doing so — plus any Active Defense bonus.
function hitStructure(t, arc, rotated) {
  const tName = THREAT_TYPES[t.type].name;
  const arcName = ARCS[arc].name;
  const angle = (arc + 0.5) * ARC_ANGLE - Math.PI / 2;
  const fx = CENTER + Math.cos(angle) * FIREWALL_RADIUS;
  const fy = CENTER + Math.sin(angle) * FIREWALL_RADIUS;
  const lead = rotated ? `${tName} rotated and` : tName;

  if (G.firewalls[arc]) {
    if (G.fortified === arc) {
      G.fortified = null;
      addFlash(fx, fy, "#ffaa00", 25);
      sfxHit();
      log(`${lead} hit the hardened firewall in ${arcName} — reinforcement lost, firewall holds.`);
    } else {
      G.firewalls[arc] = 0;
      addFlash(fx, fy, "#ff3333", 25);
      sfxFirewallDestroyed();
      log(`${lead} DESTROYED the firewall in ${arcName}!`);
    }
  } else {
    G.servers[arc] = false;
    const sr = CORE_RADIUS * 0.42;
    addFlash(CENTER + Math.cos(angle) * sr, CENTER + Math.sin(angle) * sr, "#ff0000", 35);
    sfxServerDestroyed();
    log(`${lead} DESTROYED the server in ${arcName}!`);
  }

  const dmg = 1 + (G.diffConfig ? G.diffConfig.activeDef : 0);
  damageThreat(t, dmg, "Active Defense");
}

/* ============================================================
   SPAWN PHASE — draw two tokens (more if a token says so)
   ============================================================ */
function doSpawnPhase() {
  G.phase = "spawn";
  updateAll();

  // Pre-draw every token for this phase so the queue can be built up front.
  // Extra draws granted by tokens simply come off the top next.
  const tokens = [];
  let draws = G.diffConfig ? G.diffConfig.tokensPerSpawn : 2;
  while (draws > 0) {
    const token = drawThreatToken();
    if (!token) break;
    draws--;
    tokens.push(token);
    if (token.kind === "effect") {
      draws += EFFECT_TYPES[token.type].extraDraws || 0;
    } else {
      const d = THREAT_TYPES[token.type];
      if (d.onSpawn === "draw3") draws += 3;
      if (d.onSpawn === "draw4") draws += 4;
    }
  }

  const queue = [];
  queue.push({ type: "log", msg: pick(FLAVOR.spawn), delay: 400 });

  for (const token of tokens) {
    if (token.kind === "effect") {
      const eff = EFFECT_TYPES[token.type];
      queue.push({ type: "effect", msg: `EVENT: ${eff.name} — ${eff.desc}`, flashColor: "#ff6600", delay: 600 });
      queue.push({ type: "callback", fn: () => resolveEffect(token.type), delay: 400 });
      continue;
    }

    // Threat token: roll a segment, place in the Internet ring
    const tDef = THREAT_TYPES[token.type];
    const arc = rollArc();
    const bossMsg = tDef.boss ? ` BOSS: ${tDef.ability}` : "";
    if (tDef.boss && FLAVOR.bossIntro[token.type]) {
      queue.push({ type: "log", msg: FLAVOR.bossIntro[token.type], delay: 400 });
    }
    queue.push({
      type: "spawn_threat",
      threatType: token.type,
      arc: arc,
      msg: `${tDef.name} appeared in ${ARCS[arc].name} (Internet).${bossMsg}`,
      delay: 500,
    });

    if (tDef.onSpawn === "heal") {
      queue.push({ type: "callback", fn: () => {
        let n = 0;
        for (const t of G.threats) {
          if (!t.dying && t.hp < t.maxHp) { t.hp++; t.animFlash = 0.6; n++; }
        }
        log(`Supply Chain compromise: ${n} threat${n === 1 ? "" : "s"} healed 1 HP.`);
        updateAll();
      }, delay: 400 });
    }
  }

  // End-of-spawn checks
  if (G.threatDeck.length === 0) {
    queue.push({ type: "log", msg: "Token deck empty. Survive what's left on the board!", delay: 300 });
  }
  queue.push({ type: "check_lose", delay: 200 });
  queue.push({ type: "check_win", delay: 200 });
  queue.push({ type: "callback", fn: () => {
    if (G.phase === "gameover") return;
    G.turn++;
    log(`=== TURN ${G.turn} ===`);
    if (FLAVOR.milestone[G.turn]) log(FLAVOR.milestone[G.turn]);
    if (G.threatDeck.length === 0 && liveThreats().length > 0) log("Last threats on the field. This is it.");
    doDrawPhase();
  }, delay: 300 });

  enqueueAndProcess(queue);
}

function resolveEffect(type) {
  const eff = EFFECT_TYPES[type];

  if (eff.plagueRing) {
    // Outage: discard every card of that ring (segment-pair and any-segment alike)
    const dropped = G.hand.filter(c => CARD_TYPES[c.type].ring === eff.plagueRing);
    G.hand = G.hand.filter(c => CARD_TYPES[c.type].ring !== eff.plagueRing);
    for (const c of dropped) G.cardDiscard.push(c);
    log(`${eff.name}: discarded ${dropped.length} card${dropped.length === 1 ? "" : "s"}.`);
    screenPulse("#ff6600", 1000);
    deselect();
    updateAll();
    return;
  }

  if (type === "ddos") {
    // Giant Boulder: one segment is scoured — every threat in it dies, then the firewall or server falls
    const arc = rollArc();
    let killed = 0;
    for (const t of G.threats) {
      if (t.dying || t.arc !== arc) continue;
      t.hp = 0; t.dying = true; t.animScale = 1.0; G.slain++; killed++;
      const pos = getThreatPos(t);
      addFlash(pos.x, pos.y, THREAT_TYPES[t.type].color, 20);
    }
    let structure = "";
    if (G.firewalls[arc]) {
      G.firewalls[arc] = 0;
      if (G.fortified === arc) G.fortified = null;
      structure = ", firewall DESTROYED";
    } else if (G.servers[arc]) {
      G.servers[arc] = false;
      structure = ", server DESTROYED";
    }
    log(`DDoS flooded ${ARCS[arc].name}: ${killed} threat${killed === 1 ? "" : "s"} wiped out${structure}!`);
    sfxDDoS();
    screenPulse(structure.includes("server") ? "#ff0000" : "#ff6600", 1200);
    updateAll();
    return;
  }

  if (eff.shift) {
    for (const t of G.threats) {
      if (!t.dying) t.arc = (t.arc + eff.shift + NUM_ARCS) % NUM_ARCS;
    }
    log(`${eff.name}: every threat shifted one segment ${eff.shift > 0 ? "clockwise" : "counter-clockwise"}.`);
    deselect();
    updateAll();
    return;
  }

  if (type === "zeroDay") {
    let count = 0;
    for (const t of G.threats) {
      if (t.ring >= 1 && t.ring < 3 && !t.dying) {
        t.ring++;
        t.animRing = t.ring - 1;
        t.animFlash = 1.0;
        count++;
      }
    }
    log(`ZERO-DAY EXPLOIT: ${count} threat${count === 1 ? "" : "s"} surged forward!`);
    sfxZeroDay();
    screenPulse("#ff0000", 1500);
    updateAll();
  }
  // coordinated & massCampaign are handled by the extra draws in doSpawnPhase
}


/* ============================================================
   RENDERING
   ============================================================ */
function render() {
  ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  ctx.drawImage(boardSurround(), 0, 0);

  // Draw arc sectors with pair colors, then ring borders
  for (const ring of RINGS) {
    for (let a = 0; a < NUM_ARCS; a++) {
      const startAngle = a * ARC_ANGLE - Math.PI / 2;
      const endAngle = startAngle + ARC_ANGLE;
      const arc = ARCS[a];

      ctx.beginPath();
      ctx.moveTo(CENTER, CENTER);
      ctx.arc(CENTER, CENTER, ring.outer, startAngle, endAngle);
      ctx.lineTo(CENTER, CENTER);
      ctx.closePath();

      // Clip to ring (exclude inner)
      ctx.save();
      ctx.clip();
      // Fill with pair color tint — inner rings slightly brighter
      const alpha = ring.id === 0 ? 0.06 : 0.08 + ring.id * 0.02;
      ctx.fillStyle = adjustAlpha(arc.pairColor, alpha);
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      ctx.restore();

      // Clear the inner hole for non-outermost rings
      if (ring.inner > 0) {
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(CENTER, CENTER, ring.inner, startAngle, endAngle);
        ctx.lineTo(CENTER, CENTER);
        ctx.closePath();
        // Don't actually cut — just redraw background
        ctx.restore();
      }
    }

    // Ring border circle
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, ring.outer, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(71, 96, 156, 0.55)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Core circle
  ctx.beginPath();
  ctx.arc(CENTER, CENTER, CORE_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(13, 20, 36, 0.85)";
  ctx.fill();
  ctx.strokeStyle = "rgba(71, 96, 156, 0.9)";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Arc dividers — thicker between pairs, thinner within pairs
  for (let a = 0; a < NUM_ARCS; a++) {
    const angle = a * ARC_ANGLE - Math.PI / 2;
    const isBoundary = (a % 2 === 0); // pair boundaries at 0, 2, 4
    ctx.beginPath();
    ctx.moveTo(CENTER, CENTER);
    ctx.lineTo(CENTER + Math.cos(angle) * RINGS[0].outer, CENTER + Math.sin(angle) * RINGS[0].outer);
    ctx.strokeStyle = isBoundary ? "rgba(71, 96, 156, 0.7)" : "rgba(71, 96, 156, 0.25)";
    ctx.lineWidth = isBoundary ? 1.5 : 0.5;
    ctx.stroke();
  }

  // Ring labels — along the DMZ/Web separator line, offset above it
  ctx.font = "9px 'Courier New', monospace";
  ctx.fillStyle = "rgba(154, 165, 198, 0.5)";
  ctx.textAlign = "center";
  const sepAngle = 1 * ARC_ANGLE - Math.PI / 2; // DMZ/Web boundary angle
  const perpOffset = -8; // pixels above the line (negative = CCW side)
  for (const ring of RINGS) {
    const midR = (ring.outer + ring.inner) / 2;
    const lx = CENTER + Math.cos(sepAngle) * midR + Math.cos(sepAngle - Math.PI/2) * perpOffset;
    const ly = CENTER + Math.sin(sepAngle) * midR + Math.sin(sepAngle - Math.PI/2) * perpOffset;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(sepAngle);
    ctx.fillText(ring.name.toUpperCase(), 0, 0);
    ctx.restore();
  }

  // Draw text curved along an arc
  function drawCurvedText(text, cx, cy, radius, centerAngle, fontSize, color, letterSpacing) {
    ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const charWidth = fontSize * 0.62;
    const totalWidth = text.length * (charWidth + (letterSpacing || 0));
    const angleSpan = totalWidth / radius;

    // Determine if text is on the bottom half — if so, flip it to read right-side up
    const normAngle = ((centerAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const flip = normAngle > 0.05 && normAngle < Math.PI - 0.05;

    if (flip) {
      // Bottom half: draw on inner side, reversed character order so it reads L-to-R
      const startAngle = centerAngle + angleSpan / 2;
      for (let i = 0; i < text.length; i++) {
        const charAngle = startAngle - (i + 0.5) * (angleSpan / text.length);
        const px = cx + Math.cos(charAngle) * radius;
        const py = cy + Math.sin(charAngle) * radius;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(charAngle - Math.PI / 2);
        ctx.fillText(text[i], 0, 0);
        ctx.restore();
      }
    } else {
      // Top half: normal draw
      const startAngle = centerAngle - angleSpan / 2;
      for (let i = 0; i < text.length; i++) {
        const charAngle = startAngle + (i + 0.5) * (angleSpan / text.length);
        const px = cx + Math.cos(charAngle) * radius;
        const py = cy + Math.sin(charAngle) * radius;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(charAngle + Math.PI / 2);
        ctx.fillText(text[i], 0, 0);
        ctx.restore();
      }
    }
  }

  // Pair labels — outside the board, curved along outer edge
  for (let p = 0; p < 3; p++) {
    const [a1] = SEGMENT_PAIRS[p];
    const midAngle = (a1 + 1) * ARC_ANGLE - Math.PI / 2;
    const r = RINGS[0].outer + 16;
    drawCurvedText(PAIR_NAMES[p], CENTER, CENTER, r, midAngle, 12, adjustAlpha(ARCS[a1].pairColor, 0.8), 1);
  }

  // Individual arc names — inside the Internet ring, curved
  for (let a = 0; a < NUM_ARCS; a++) {
    const angle = (a + 0.5) * ARC_ANGLE - Math.PI / 2;
    const r = (RINGS[0].outer + RINGS[0].inner) / 2 + 2;
    drawCurvedText(ARCS[a].name, CENTER, CENTER, r, angle, 10, adjustAlpha(ARCS[a].color, 0.5), 0);
  }

  if (!G) return;

  // Draw firewalls
  for (let a = 0; a < NUM_ARCS; a++) {
    const angle = (a + 0.5) * ARC_ANGLE - Math.PI / 2;
    const x = CENTER + Math.cos(angle) * FIREWALL_RADIUS;
    const y = CENTER + Math.sin(angle) * FIREWALL_RADIUS;
    if (G.firewalls[a]) {
      // Firewall icon — brick wall with 3D side panel
      const fw = 20, fh = 22, sd = 6;
      const damaged = false;
      const fwStroke = damaged ? "#ddaa00" : "#4ade6a";
      const fwFill = damaged ? "rgba(200, 160, 0, 0.2)" : "rgba(74, 222, 106, 0.2)";
      const fwSideFill = damaged ? "rgba(160, 130, 0, 0.15)" : "rgba(52, 170, 80, 0.15)";
      const fwSideStroke = damaged ? "#bb8800" : "#34aa50";
      const fwTopFill = damaged ? "rgba(180, 140, 0, 0.12)" : "rgba(60, 195, 92, 0.12)";
      ctx.save();
      ctx.translate(x, y);

      // Front face — brick wall
      ctx.fillStyle = fwFill;
      ctx.fillRect(-fw/2, -fh/2, fw, fh);
      ctx.strokeStyle = fwStroke;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-fw/2, -fh/2, fw, fh);

      // Horizontal mortar lines (4 rows of bricks)
      ctx.lineWidth = 0.8;
      const rows = 4;
      const rh = fh / rows;
      for (let r = 1; r < rows; r++) {
        ctx.beginPath();
        ctx.moveTo(-fw/2, -fh/2 + r * rh);
        ctx.lineTo(fw/2, -fh/2 + r * rh);
        ctx.stroke();
      }
      // Vertical mortar — staggered per row
      for (let r = 0; r < rows; r++) {
        const ry = -fh/2 + r * rh;
        const offset = (r % 2 === 0) ? 0 : fw/4;
        ctx.beginPath();
        for (let vx = -fw/2 + fw/2 + offset; vx < fw/2; vx += fw/2) {
          ctx.moveTo(vx, ry);
          ctx.lineTo(vx, ry + rh);
        }
        if (r % 2 !== 0) {
          ctx.moveTo(-fw/2 + fw/4, ry);
          ctx.lineTo(-fw/2 + fw/4, ry + rh);
          ctx.moveTo(-fw/2 + 3*fw/4, ry);
          ctx.lineTo(-fw/2 + 3*fw/4, ry + rh);
        } else {
          ctx.moveTo(0, ry);
          ctx.lineTo(0, ry + rh);
        }
        ctx.stroke();
      }

      // 3D side panel (right side, slight depth)
      ctx.fillStyle = fwSideFill;
      ctx.strokeStyle = fwSideStroke;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(fw/2, -fh/2);
      ctx.lineTo(fw/2 + sd, -fh/2 - sd/2);
      ctx.lineTo(fw/2 + sd, fh/2 - sd/2);
      ctx.lineTo(fw/2, fh/2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 3D top panel
      ctx.fillStyle = fwTopFill;
      ctx.beginPath();
      ctx.moveTo(-fw/2, -fh/2);
      ctx.lineTo(-fw/2 + sd, -fh/2 - sd/2);
      ctx.lineTo(fw/2 + sd, -fh/2 - sd/2);
      ctx.lineTo(fw/2, -fh/2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Hardened firewall — extra outline plus a "2" badge
      if (G.fortified === a) {
        ctx.strokeStyle = "#dbe4fb";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([2, 2]);
        ctx.strokeRect(-fw/2 - 4, -fh/2 - 4, fw + 8, fh + 8);
        ctx.setLineDash([]);
        ctx.fillStyle = "#dbe4fb";
        ctx.font = "bold 9px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("x2", 0, fh/2 + 9);
      }

      ctx.restore();
    } else {
      // Destroyed firewall — dashed outline with X
      const fw = 20, fh = 22;
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "rgba(255, 51, 51, 0.25)";
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(-fw/2, -fh/2, fw, fh);
      ctx.setLineDash([]);
      ctx.strokeStyle = "rgba(255, 51, 51, 0.4)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-fw/2 + 3, -fh/2 + 3); ctx.lineTo(fw/2 - 3, fh/2 - 3);
      ctx.moveTo(fw/2 - 3, -fh/2 + 3); ctx.lineTo(-fw/2 + 3, fh/2 - 3);
      ctx.stroke();
      ctx.restore();

    }
  }

  // Firewall-slot highlights for Harden / Hardware+Config
  if (G.fwTargets) {
    for (const a of G.fwTargets.arcs) {
      const angle = (a + 0.5) * ARC_ANGLE - Math.PI / 2;
      const x = CENTER + Math.cos(angle) * FIREWALL_RADIUS;
      const y = CENTER + Math.sin(angle) * FIREWALL_RADIUS;
      ctx.beginPath();
      ctx.arc(x, y, 24, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(84, 242, 255, 0.8)";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(x, y, 24, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(84, 242, 255, 0.08)";
      ctx.fill();
    }
  }

  // Draw servers (database cylinder — stacked ovals)
  for (let a = 0; a < NUM_ARCS; a++) {
    const angle = (a + 0.5) * ARC_ANGLE - Math.PI / 2;
    const r = CORE_RADIUS * 0.42;
    const x = CENTER + Math.cos(angle) * r;
    const y = CENTER + Math.sin(angle) * r;
    const w = 12, h = 20, ov = 5; // half-width, total height, oval ry

    if (G.servers[a]) {
      ctx.strokeStyle = "#dbe4fb";
      ctx.lineWidth = 2;

      // Solid cylinder — bottom hidden, only front visible
      // 1. Fill body rectangle (covers everything between top and bottom)
      ctx.fillStyle = "#273249";
      ctx.fillRect(x - w, y - h/2, w * 2, h);

      // 2. Cover bottom with solid fill (flat bottom, no visible ellipse)
      ctx.beginPath();
      ctx.ellipse(x, y + h/2, w, ov, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#273249";
      ctx.fill();

      // 3. Side lines
      ctx.beginPath();
      ctx.moveTo(x - w, y - h/2); ctx.lineTo(x - w, y + h/2);
      ctx.moveTo(x + w, y - h/2); ctx.lineTo(x + w, y + h/2);
      ctx.stroke();

      // 4. Bottom edge (front arc only — just the visible curve)
      ctx.beginPath();
      ctx.ellipse(x, y + h/2, w, ov, 0, 0, Math.PI);
      ctx.stroke();

      // 5. Two tier lines (front arcs)
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(x, y - h * 0.15, w, ov, 0, 0, Math.PI);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x, y + h * 0.15, w, ov, 0, 0, Math.PI);
      ctx.stroke();

      // 6. Top cap — brightest, full ellipse
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x, y - h/2, w, ov, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#47609c";
      ctx.fill();
      ctx.stroke();
    } else {
      // Destroyed — dashed outline
      const bodyColor = "rgba(100, 30, 30, 0.25)";
      ctx.fillStyle = bodyColor;
      ctx.strokeStyle = "rgba(255, 51, 51, 0.25)";
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.ellipse(x, y - h/2, w, ov, 0, Math.PI, Math.PI * 2);
      ctx.lineTo(x + w, y + h/2);
      ctx.ellipse(x, y + h/2, w, ov, 0, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x, y - h/2, w, ov, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      // X
      ctx.strokeStyle = "rgba(255, 51, 51, 0.4)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - w + 2, y - h/2); ctx.lineTo(x + w - 2, y + h/2);
      ctx.moveTo(x + w - 2, y - h/2); ctx.lineTo(x - w + 2, y + h/2);
      ctx.stroke();
    }
  }

  // Highlighted valid targets — much larger hit area
  for (const ht of highlightedTargets) {
    const threat = G.threats.find(t => t.id === ht.threatId);
    if (!threat) continue;
    const pos = getThreatPos(threat);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 28, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(84, 242, 255, 0.8)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    // Clickable area fill
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 28, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(84, 242, 255, 0.08)";
    ctx.fill();
  }

  // Draw threats
  for (const t of G.threats) {
    drawThreat(t);
  }

  // Flash effects
  for (const f of flashEffects) {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius * (1 + (1 - f.life) * 0.5), 0, Math.PI * 2);
    ctx.fillStyle = adjustAlpha(f.color, f.life * 0.4);
    ctx.fill();
  }
}

function getThreatPos(t) {
  const angle = (t.arc + 0.5) * ARC_ANGLE - Math.PI / 2;
  const displayRing = t.animRing !== undefined ? t.animRing : t.ring;
  let r;
  if (displayRing <= 3) {
    // Interpolate between ring positions
    const ringIdx = Math.floor(Math.max(0, Math.min(3, displayRing)));
    const frac = displayRing - ringIdx;
    const ring1 = RINGS[ringIdx];
    const r1 = (ring1.outer + ring1.inner) / 2;
    if (frac > 0.01 && ringIdx < 3) {
      const ring2 = RINGS[ringIdx + 1];
      const r2 = (ring2.outer + ring2.inner) / 2;
      r = r1 + (r2 - r1) * frac;
    } else {
      r = r1;
    }
  } else {
    r = CORE_RADIUS * 0.68;
  }
  // Offset if multiple threats in same position — spread along the arc
  const samePos = G.threats.filter(o => o.ring === t.ring && o.arc === t.arc && o.id < t.id && !o.dying).length;
  if (samePos > 0) {
    // Offset along the arc (angular offset) rather than perpendicular
    const angularSpread = 0.12; // radians per stacked threat
    const offsetDir = samePos % 2 === 0 ? 1 : -1;
    const offsetIdx = Math.ceil(samePos / 2);
    const adjustedAngle = angle + angularSpread * offsetIdx * offsetDir;
    return {
      x: CENTER + Math.cos(adjustedAngle) * r,
      y: CENTER + Math.sin(adjustedAngle) * r,
    };
  }

  return {
    x: CENTER + Math.cos(angle) * r,
    y: CENTER + Math.sin(angle) * r,
  };
}

function drawPolygon(cx, cy, r, sides, rotation) {
  // sides=0 means circle
  if (sides === 0) {
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    return;
  }
  const rot = rotation || -Math.PI / 2; // point up by default
  for (let i = 0; i <= sides; i++) {
    const angle = rot + (i * Math.PI * 2) / sides;
    const px = cx + Math.cos(angle) * r;
    const py = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
}

function drawThreat(t) {
  const tDef = THREAT_TYPES[t.type];
  const pos = getThreatPos(t);
  const scale = t.animScale !== undefined ? Math.max(0, t.animScale) : 1;
  if (scale <= 0) return;

  const r = (tDef.boss ? 22 : 18) * scale * (t.ring === CORE_RING ? 0.7 : 1);
  const sides = tDef.sides;
  // Diamond rotated 45 degrees looks better
  const rotation = sides === 4 ? 0 : -Math.PI / 2;

  ctx.save();
  ctx.globalAlpha = Math.min(1, scale + 0.2);

  // Shape fill
  ctx.beginPath();
  drawPolygon(pos.x, pos.y, r, sides, rotation);
  ctx.closePath();
  ctx.fillStyle = adjustAlpha(tDef.color, 0.3);
  ctx.fill();
  ctx.strokeStyle = tDef.color;
  ctx.lineWidth = tDef.boss ? 2.5 : 1.5;
  ctx.stroke();

  // Flash overlay
  if (t.animFlash > 0) {
    ctx.beginPath();
    drawPolygon(pos.x, pos.y, r + 3, sides, rotation);
    ctx.closePath();
    ctx.fillStyle = `rgba(255, 255, 255, ${t.animFlash * 0.5})`;
    ctx.fill();
  }

  // Glyph
  if (scale > 0.4) {
    const fontSize = Math.round((tDef.boss ? 13 : 11) * scale);
    ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
    ctx.fillStyle = tDef.color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(tDef.glyph, pos.x, pos.y - 1 * scale);

    // HP dots below the shape
    const dotR = 3 * scale;
    const dotY = pos.y + r + dotR + 3 * scale;
    const totalW = (t.maxHp - 1) * (dotR * 2.5);
    const startX = pos.x - totalW / 2;
    for (let i = 0; i < t.maxHp; i++) {
      const dx = startX + i * dotR * 2.5;
      ctx.beginPath();
      ctx.arc(dx, dotY, dotR, 0, Math.PI * 2);
      if (i < t.hp) {
        // Filled dot = remaining HP
        ctx.fillStyle = t.hp === t.maxHp ? tDef.color : (t.hp === 1 ? "#ff3333" : "#ffb000");
        ctx.fill();
      } else {
        // Empty dot = lost HP
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  // Honeypot indicator
  if (t.honeypotted) {
    ctx.font = `bold ${Math.round(8 * scale)}px 'Courier New', monospace`;
    ctx.fillStyle = "#dbe4fb";
    ctx.textAlign = "center";
    ctx.fillText("\u2691", pos.x + r + 6, pos.y); // flag icon
  }

  ctx.restore();
}

/* The Internet around the board: a line-drawn scene in the corners the
   round board leaves empty, after the scenery behind PumaTriage and
   PumaHeart and in their colours. The network rings echo outward, a mesh of
   hosts sits beyond them with a few lit, and one is hot: that is where the
   threats come from. No text, and low contrast on purpose: it frames the board and never
   competes with it. Drawn once, on a fixed seed, and stamped every frame. */
let surroundCanvas = null;
function boardSurround() {
  if (surroundCanvas) return surroundCanvas;
  surroundCanvas = document.createElement("canvas");
  surroundCanvas.width = surroundCanvas.height = CANVAS_SIZE;
  const c = surroundCanvas.getContext("2d");
  let seed = 11;
  const rnd = n => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed % n; };
  const S = CANVAS_SIZE, CLEAR = RINGS[0].outer + 30; // stay outside the pair labels

  c.fillStyle = "#05070f";
  c.fillRect(0, 0, S, S);
  // Everything below is clipped to the square minus the board's disc.
  c.save();
  c.beginPath();
  c.rect(0, 0, S, S);
  c.arc(CENTER, CENTER, CLEAR, 0, Math.PI * 2, true);
  c.clip();

  // A slow glow off each corner, so the corners read as space rather than void.
  for (const [x, y] of [[0, 0], [S, 0], [0, S], [S, S]]) {
    const g = c.createRadialGradient(x, y, 0, x, y, 260);
    g.addColorStop(0, "rgba(13, 20, 38, 0.9)");
    g.addColorStop(1, "rgba(13, 20, 38, 0)");
    c.fillStyle = g;
    c.fillRect(0, 0, S, S);
  }

  // The rings carry on past the edge of the board.
  c.strokeStyle = "#141d33";
  c.lineWidth = 1;
  c.setLineDash([2, 6]);
  for (let r = CLEAR + 20; r < S * 0.71; r += 36) {
    c.beginPath(); c.arc(CENTER, CENTER, r, 0, Math.PI * 2); c.stroke();
  }
  c.setLineDash([]);
  // And so do the six segment dividers.
  c.strokeStyle = "#141d33";
  for (let a = 0; a < NUM_ARCS; a++) {
    const ang = a * ARC_ANGLE - Math.PI / 2;
    c.beginPath();
    c.moveTo(CENTER + Math.cos(ang) * CLEAR, CENTER + Math.sin(ang) * CLEAR);
    c.lineTo(CENTER + Math.cos(ang) * S, CENTER + Math.sin(ang) * S);
    c.stroke();
  }

  // The hosts, each corner its own little network joined to its nearest two.
  const nodes = [];
  for (let i = 0; i < 2000 && nodes.length < 72; i++) {
    const x = 14 + rnd(S - 28), y = 14 + rnd(S - 28);
    if (Math.hypot(x - CENTER, y - CENTER) < CLEAR + 12) continue;
    if (nodes.some(([nx, ny]) => Math.hypot(nx - x, ny - y) < 28)) continue;
    nodes.push([x, y]);
  }
  const quad = ([x, y]) => (x < CENTER ? 0 : 1) + (y < CENTER ? 0 : 2);
  const seen = new Set();
  c.strokeStyle = "#1d2948";
  c.lineWidth = 1.2;
  nodes.forEach((a, i) => {
    nodes.map((b, j) => [j, Math.hypot(a[0] - b[0], a[1] - b[1])])
      .filter(([j]) => j !== i && quad(nodes[j]) === quad(a))
      .sort((x, y) => x[1] - y[1]).slice(0, 2).forEach(([j]) => {
        const k = i < j ? i + "-" + j : j + "-" + i;
        if (seen.has(k)) return; seen.add(k);
        c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(nodes[j][0], nodes[j][1]); c.stroke();
      });
  });
  nodes.forEach(([x, y], i) => {
    c.beginPath(); c.arc(x, y, 3.5, 0, Math.PI * 2);
    c.fillStyle = "#0a0f1d"; c.fill();
    c.strokeStyle = "#2a3960"; c.lineWidth = 1.5; c.stroke();
    if (i % 4 === 0) {
      c.beginPath(); c.arc(x, y, 1.8, 0, Math.PI * 2);
      c.fillStyle = i % 12 === 0 ? "rgba(74, 222, 106, 0.4)" : "rgba(84, 242, 255, 0.4)"; c.fill();
    }
  });
  // One host is hot.
  const hot = nodes.reduce((m, n) => n[0] > CENTER && n[0] < S - 50 && n[1] > 50 && n[1] < CENTER && Math.hypot(n[0] - S, n[1]) < Math.hypot(m[0] - S, m[1]) ? n : m, [CENTER, CENTER]);
  if (hot[0] !== CENTER) {
    c.beginPath(); c.arc(hot[0], hot[1], 2.6, 0, Math.PI * 2); c.fillStyle = "rgba(255, 176, 0, 0.6)"; c.fill();
    c.strokeStyle = "#ffb000"; c.lineWidth = 1.5;
    for (const [r, al] of [[11, 0.3], [22, 0.14]]) {
      c.globalAlpha = al; c.beginPath(); c.arc(hot[0], hot[1], r, 0, Math.PI * 2); c.stroke();
    }
    c.globalAlpha = 1;
  }
  c.restore();

  // Corner brackets, like a viewfinder on the map.
  c.strokeStyle = "#2a3960";
  c.lineWidth = 2;
  for (const [x, y, dx, dy] of [[8, 8, 1, 1], [S - 8, 8, -1, 1], [8, S - 8, 1, -1], [S - 8, S - 8, -1, -1]]) {
    c.beginPath(); c.moveTo(x, y + dy * 26); c.lineTo(x, y); c.lineTo(x + dx * 26, y); c.stroke();
  }
  return surroundCanvas;
}

function adjustAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ============================================================
   CLICK HANDLING
   ============================================================ */
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  // Account for object-fit: contain letterboxing
  const canvasAspect = canvas.width / canvas.height; // 1:1
  const rectAspect = rect.width / rect.height;
  let renderW, renderH, offsetX, offsetY;
  if (rectAspect > canvasAspect) {
    // Wider than tall — letterboxed on sides
    renderH = rect.height;
    renderW = rect.height * canvasAspect;
    offsetX = (rect.width - renderW) / 2;
    offsetY = 0;
  } else {
    // Taller than wide — letterboxed on top/bottom
    renderW = rect.width;
    renderH = rect.width / canvasAspect;
    offsetX = 0;
    offsetY = (rect.height - renderH) / 2;
  }

  return {
    x: ((e.clientX - rect.left - offsetX) / renderW) * CANVAS_SIZE,
    y: ((e.clientY - rect.top - offsetY) / renderH) * CANVAS_SIZE,
  };
}

function modalOpen() {
  return document.getElementById("modal-overlay").classList.contains("active");
}

function setupInput() {
  canvas.addEventListener("click", (e) => {
    if (!G || G.phase !== "play" || selectedCardIdx === null || animating || inputLock) return;
    const { x, y } = getCanvasCoords(e);

    // Firewall targeting (Harden, Hardware + Config)
    if (G.fwTargets && G.fwTargets.arcs.length > 0) {
      for (const arcIdx of G.fwTargets.arcs) {
        const angle = (arcIdx + 0.5) * ARC_ANGLE - Math.PI / 2;
        const fx = CENTER + Math.cos(angle) * FIREWALL_RADIUS;
        const fy = CENTER + Math.sin(angle) * FIREWALL_RADIUS;
        if (Math.hypot(x - fx, y - fy) < 30) {
          clickFirewall(arcIdx);
          return;
        }
      }
      return; // clicked elsewhere, ignore
    }

    // Threat targeting — only consider valid targets
    if (highlightedTargets.length === 0) return;
    for (const ht of highlightedTargets) {
      const t = G.threats.find(th => th.id === ht.threatId);
      if (!t || t.dying) continue;
      const pos = getThreatPos(t);
      if (Math.hypot(x - pos.x, y - pos.y) < 30) {
        clickThreat(t.id);
        return;
      }
    }
  });

  // Keyboard
  document.addEventListener("keydown", (e) => {
    if (titleOpen && titleKey(e)) return;
    if (e.key === "Escape") {
      if (modalOpen()) {
        const content = document.getElementById("modal-content");
        if (content.dataset.dismissable === "true") { closeModal(); deselect(); if (G) updateAll(); }
        return;
      }
      deselect();
      if (G) updateAll();
      return;
    }
    if (e.key === "h" || e.key === "H") {
      if (modalOpen() && document.getElementById("modal-content").dataset.help === "true") closeModal();
      else if (!modalOpen()) showHowToPlay();
      return;
    }
    if (modalOpen()) return; // never let game keys through a dialog
    if (e.key === "m" || e.key === "M") { toggleMute(); return; }
    if (!G) return;

    // Number keys select cards (hand can grow past 6 via Threat Intel)
    const num = parseInt(e.key);
    if (num >= 1 && num <= 9 && num <= G.hand.length) {
      selectCard(num - 1);
      return;
    }

    // Enter/Space
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (G.phase === "discard") skipDiscard();
      else if (G.phase === "play") endPlayPhase();
    }
  });
}

function updateAll() {

function updateCanvasLabel() {
  const c = document.getElementById("game-canvas");
  if (!c || !G) return;
  const threats = liveThreats().length;

  const fws = G.firewalls.filter(f => f > 0).length;

    `Network defense board. Turn ${G.turn}. ${threats} threats on board. ${servers} of 6 servers intact. ${fws} of 6 firewalls intact. Phase: ${G.phase}.`

let prevHUDState = {};
function updateHUD() {
  const stats = {
    turn: G.turn,
    tokens: G.threatDeck.length,
    servers: G.servers.filter(Boolean).length,
    slain: G.slain,
  };

  function flashStat(id, cls) {
    const el = document.getElementById(id);
    el.classList.remove("flash", "flash-red");
    void el.offsetWidth; // force reflow
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 600);
  }

  document.getElementById("stat-turn").textContent = stats.turn;
  document.getElementById("stat-threats").textContent = stats.tokens;
  document.getElementById("stat-servers").textContent = stats.servers + "/6";
  document.getElementById("stat-slain").textContent = stats.slain;

  // Flash on change
  if (prevHUDState.slain !== undefined && stats.slain > prevHUDState.slain) flashStat("stat-slain", "flash");
  if (prevHUDState.servers !== undefined && stats.servers < prevHUDState.servers) flashStat("stat-servers", "flash-red");
  if (prevHUDState.turn !== undefined && stats.turn > prevHUDState.turn) flashStat("stat-turn", "flash");

  prevHUDState = { ...stats };
}

function cardSortKey(card) {
  const def = CARD_TYPES[card.type];
  // Segment group: specials first, then any-segment ring cards, then the three pairs
  let seg;
  if (def.segment === "pair") seg = 2 + (card.pairIdx || 0);
  else if (def.segment === "any" && typeof def.ring === "number") seg = 1;
  else seg = 0;
  // Within a group: any-ring first, then Endpoint, Network, Perimeter (most urgent first)
  const ringOrder = { 3: 1, 2: 2, 1: 3 };
  const ring = typeof def.ring === "number" ? (ringOrder[def.ring] || 0) : 0;
  return seg * 10 + ring;
}

function updateHand() {
  const container = document.getElementById("card-hand");
  container.classList.toggle("discard-phase", G.phase === "discard");

  // FLIP Step 1 (FIRST): snapshot existing card positions
  const oldPositions = new Map();
  container.querySelectorAll(".card[data-card-id]").forEach(el => {
    const uid = el.dataset.cardId;
    const rect = el.getBoundingClientRect();
    oldPositions.set(uid, { top: rect.top, left: rect.left });
  });

  // Rebuild DOM
  container.innerHTML = "";

  const segBadgeClass = ["badge-dmzweb", "badge-corpeng", "badge-finexec"];

  // Build sorted indices
  const indices = G.hand.map((_, i) => i);
  indices.sort((a, b) => cardSortKey(G.hand[a]) - cardSortKey(G.hand[b]));

  let newCardStagger = 0;

  for (const i of indices) {
    const card = G.hand[i];
    const def = CARD_TYPES[card.type];

    const el = document.createElement("div");
    el.className = "card";
    el.dataset.cardId = card._uid;
    if (i === selectedCardIdx) el.classList.add("selected");
    if (def.kind === "dead") {
      if (G.phase === "discard") el.classList.add("misconfig-discard");
      else el.classList.add("disabled");
    }
    // The partner of a selected build card is shown as selected too
    if (G.fwTargets && G.fwTargets.mode === "build" && i === G.fwTargets.partnerIdx) el.classList.add("selected");

    // Ring badge
    let ringBadge = "";
    if (def.ring === 1) ringBadge = `<span class="card-badge badge-perimeter">◎ Perimeter</span>`;
    else if (def.ring === 2) ringBadge = `<span class="card-badge badge-network">◎ Network</span>`;
    else if (def.ring === 3) ringBadge = `<span class="card-badge badge-endpoint">◎ Endpoint+Core</span>`;
    else if (def.ring === "any") ringBadge = `<span class="card-badge badge-any-ring">◎ Any Ring</span>`;
    else if (def.ring === "outer") ringBadge = `<span class="card-badge badge-any-ring">◎ Outer Rings</span>`;
    else if (def.kind !== "dead") ringBadge = `<span class="card-badge badge-special">☆ Special</span>`;

    // Segment badge
    let segBadge = "";
    if (def.segment === "pair" && card.pairIdx !== undefined) {
      segBadge = `<span class="card-badge ${segBadgeClass[card.pairIdx]}">■ ${PAIR_NAMES[card.pairIdx]}</span>`;
    } else if (def.segment === "any" && typeof def.ring === "number") {
      segBadge = `<span class="card-badge badge-segment">■ Any Segment</span>`;
    }

    // Card description
    const descText = def.kind === "dead"
      ? `<span class="card-desc" style="color:var(--red)">${def.desc}</span>`
      : `<span class="card-desc">${def.desc}</span>`;

    el.innerHTML = `
      <span class="card-key">${i + 1}</span>
      <span class="card-name">${def.name}</span>
      <div class="card-badges">${ringBadge}${segBadge}</div>
      ${descText}
    `;
    el.title = def.desc;

    // Only animate entry for NEW cards (not previously in DOM)
    const uidStr = String(card._uid);
    if (!oldPositions.has(uidStr)) {
      el.classList.add("card-enter");
      el.style.animationDelay = (newCardStagger * 60) + "ms";
      newCardStagger++;
    }

    el.addEventListener("click", () => selectCard(i));
    container.appendChild(el);
  }

  // FLIP Step 2 (LAST + INVERT + PLAY): animate surviving cards to new positions
  requestAnimationFrame(() => {
    container.querySelectorAll(".card[data-card-id]").forEach(el => {
      const uid = el.dataset.cardId;
      if (!oldPositions.has(uid)) return; // new card, handled by card-enter

      const oldPos = oldPositions.get(uid);
      const newRect = el.getBoundingClientRect();
      const deltaX = oldPos.left - newRect.left;
      const deltaY = oldPos.top - newRect.top;

      if (Math.abs(deltaX) < 1 && Math.abs(deltaY) < 1) return; // no movement

      // INVERT: jump to old position
      el.style.transition = "none";
      el.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

      // PLAY: animate to new position
      requestAnimationFrame(() => {
        el.style.transition = "transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)";
        el.style.transform = "";

        // Clean up inline styles after animation
        el.addEventListener("transitionend", function cleanup(e) {
          if (e.propertyName === "transform") {
            el.style.transition = "";
            el.style.transform = "";
            el.removeEventListener("transitionend", cleanup);
          }
        });
      });
    });
  });

  // Action buttons
  const actions = document.getElementById("hand-actions");
  actions.innerHTML = "";
  if (G.phase === "discard") {
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = "Skip Discard";
    btn.onclick = skipDiscard;
    actions.appendChild(btn);
  } else if (G.phase === "play") {
    const btn = document.createElement("button");
    btn.className = "action-btn primary";
    btn.textContent = "End Play Phase";
    btn.onclick = endPlayPhase;
    actions.appendChild(btn);
  }
}

let prevPhase = null;
function updatePhaseUI() {
  const display = document.getElementById("phase-display");
  const instr = document.getElementById("phase-instructions");

  const phases = {
    draw: ["Draw Phase", "Drawing cards to fill your hand..."],
    discard: ["Discard Phase", "Click one card to discard it and draw a replacement, or click Skip Discard."],
    play: ["Play Phase", "Click a card, then click a highlighted threat or firewall on the board. Click End Play Phase when done."],
    advance: ["Threats Advancing", "Every threat moves 1 ring closer to your servers..."],
    spawn: ["Drawing Tokens", "New threats are emerging from the Internet..."],
    gameover: ["Game Over", ""],
  };

  const [name, instructions] = phases[G.phase] || ["", ""];
  display.textContent = `Turn ${G.turn} — ${name}`;
  instr.textContent = instructions;

  // Animate phase change
  if (prevPhase !== G.phase) {
    display.classList.remove("phase-change", "phase-danger");
    void display.offsetWidth;
    display.classList.add("phase-change");
    if (G.phase === "advance" || G.phase === "spawn") display.classList.add("phase-danger");
    sfxPhaseChange();
    // No banner for the token draw: it is over in a moment and needs nothing from the player
    if (name && G.phase !== "gameover" && G.phase !== "spawn") showPhaseToast(name, G.phase === "advance");
    prevPhase = G.phase;
  }
}

// Brief centered banner over the board naming the phase just entered.
let _phaseToastTimer = null;
function showPhaseToast(text, danger) {
  const el = document.getElementById("phase-toast");
  if (!el) return;
  if (_phaseToastTimer) clearTimeout(_phaseToastTimer);
  el.textContent = text;
  el.classList.remove("active", "danger");
  if (danger) el.classList.add("danger");
  void el.offsetWidth; // restart the animation
  el.classList.add("active");
  _phaseToastTimer = setTimeout(() => { el.classList.remove("active"); _phaseToastTimer = null; }, 900);
}

function getCardName(card) {
  const def = CARD_TYPES[card.type];
  if (def.segment === "pair" && card.pairIdx !== undefined) {
    return `${def.name} [${PAIR_NAMES[card.pairIdx]}]`;
  }
  return def.name;
}

function log(msg, level) {
  if (tableQuiet) return;   /* the title's table plays in silence */
  if (G) G.log.push(msg);

  // Auto-detect level from message content if not specified
  if (!level) {
    if (/DESTROYED|BREACH|ZERO-DAY|DDoS|slipped into the Core/i.test(msg)) level = "danger";
    else if (/BOSS|Ransomware|Nation State|surged|Coordinated|Mass Campaign|EVENT:|Outage|Lateral/i.test(msg)) level = "warn";
    else if (/SLAIN|rebuilt|hardened|Quarantined|recovered|holds/i.test(msg)) level = "good";
  }

  const list = document.getElementById("log-list");
  if (list) {
    const li = document.createElement("li");
    li.textContent = msg;
    if (level) li.classList.add("log-" + level);
    list.insertBefore(li, list.firstChild);
    while (list.children.length > 50) list.removeChild(list.lastChild);
  }

  const ann = document.getElementById("announcements");
  ann.textContent = msg;
}
