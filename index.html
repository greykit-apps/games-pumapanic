/* ============================================================
   TURN PHASES
   1 Draw up · 2 Discard & draw one · 3 Play cards · 4 Advance · 5 Spawn two tokens
   ============================================================ */
function doDrawPhase() {
  G.phase = "draw";
  G.discardsUsed = 0;
  const handSize = G.diffConfig ? G.diffConfig.handSize : 6;
  while (G.hand.length < handSize && (G.cardDeck.length > 0 || G.cardDiscard.length > 0)) {
    drawCard();
  }
  sfxDraw();
  // Auto-advance to discard phase
  G.phase = "discard";
  selectedCardIdx = null;
  highlightedTargets = [];
  G.fwTargets = null;
  updateAll();
}

function doDiscardCard(idx) {
  if (G.phase !== "discard" || inputLock || G.discardsUsed >= 1) return;
  const card = G.hand.splice(idx, 1)[0];
  if (!card) return;
  G.cardDiscard.push(card);
  G.discardsUsed++;
  drawCard();
  log(`Discarded ${getCardName(card)}, drew a new card.`);
  selectedCardIdx = null;
  G.phase = "play";
  animateCardOut(card, "discard", updateAll);
}

function skipDiscard() {
  if (G.phase !== "discard" || inputLock) return;
  G.phase = "play";
  selectedCardIdx = null;
  updateAll();
}

function endPlayPhase() {
  if (G.phase !== "play" || animating || inputLock) return;
  G.phase = "advance";
  deselect();
  updateAll();
  // Small delay then advance
  pendingTimer = setTimeout(doAdvancePhase, 400);
}

function deselect() {
  selectedCardIdx = null;
  highlightedTargets = [];
  if (G) G.fwTargets = null;
}

/* ============================================================
   PLAYING CARDS
   ============================================================ */
function selectCard(idx) {
  if (!G || inputLock || animating) return;
  if (G.phase === "discard") {
    doDiscardCard(idx);
    return;
  }
  if (G.phase !== "play") return;

  const card = G.hand[idx];
  if (!card) return;
  const def = CARD_TYPES[card.type];

  // Clicking the selected card again deselects it
  if (selectedCardIdx === idx) { deselect(); updateAll(); return; }
  deselect();

  switch (def.kind) {
    case "dead":
      log("Misconfigured cards do nothing. Discard one during the Discard phase.");
      updateAll();
      return;

    case "draw": {
      consumeCards([idx], "play");
      let n = 0;
      if (drawCard()) n++;
      if (drawCard()) n++;
      log(`Threat Intel: drew ${n} card${n === 1 ? "" : "s"}.`);
      return;
    }

    case "scavenge":
      if (G.cardDiscard.length === 0) {
        log("The discard pile is empty — nothing to recover.");
        updateAll();
        return;
      }
      selectedCardIdx = idx;
      updateAll();
      showScavengeModal();
      return;

    case "fortify": {
      const arcs = G.firewalls.map((fw, i) => (fw && G.fortified !== i) ? i : -1).filter(i => i >= 0);
      if (arcs.length === 0) {
        log("No standing firewall to harden.");
        updateAll();
        return;
      }
      selectedCardIdx = idx;
      G.fwTargets = { mode: "fortify", arcs };
      updateAll();
      return;
    }

    case "build": {
      const partnerIdx = G.hand.findIndex((c, i) => i !== idx && c.type === def.partner);
      if (partnerIdx < 0) {
        log(`${def.name} needs a ${CARD_TYPES[def.partner].name} card played with it to rebuild a firewall.`);
        updateAll();
        return;
      }
      const arcs = G.firewalls.map((fw, i) => (!fw && G.servers[i]) ? i : -1).filter(i => i >= 0);
      if (arcs.length === 0) {
        log("No destroyed firewall with a standing server behind it.");
        updateAll();
        return;
      }
      selectedCardIdx = idx;
      G.fwTargets = { mode: "build", arcs, partnerIdx };
      updateAll();
      return;
    }

    default: // hit, slay, push, hold — target a threat on the board
      selectedCardIdx = idx;
      highlightedTargets = getValidTargets(card);
      if (highlightedTargets.length === 0) log(`No valid target for ${getCardName(card)} right now.`);
      updateAll();
  }
}

function getValidTargets(card) {
  const def = CARD_TYPES[card.type];
  const targets = [];

  for (const t of G.threats) {
    if (t.ring === 0) continue;          // nothing reaches the Internet ring
    if (t.hp <= 0 || t.dying) continue;  // already dead, animating out

    let ringOk;
    if (def.ring === "any") ringOk = t.ring >= 1;
    else if (def.ring === "outer") ringOk = t.ring >= 1 && t.ring <= 3;
    else ringOk = t.ring === def.ring || (def.ring === 3 && t.ring === CORE_RING); // Endpoint cards also reach the Core
    if (!ringOk) continue;

    // Nation State add-on: immune to Perimeter-ring cards
    if (t.immunePerimeter && def.ring === 1) continue;

    if (def.segment === "pair" && card.pairIdx !== undefined) {
      if (!SEGMENT_PAIRS[card.pairIdx].includes(t.arc)) continue;
    }

    targets.push({ ring: t.ring, arc: t.arc, threatId: t.id });
  }
  return targets;
}

// Remove cards from the hand into the discard pile, animating the first one out.
function consumeCards(indices, mode) {
  const lead = G.hand[indices[0]]; // the card the player clicked
  const sorted = [...indices].sort((a, b) => b - a);
  const cards = sorted.map(i => G.hand.splice(i, 1)[0]).filter(Boolean);
  for (const c of cards) G.cardDiscard.push(c);
  deselect();
  animateCardOut(lead, mode || "play", updateAll);
}

// Apply damage to a threat and handle its death. Returns true if it died.
function damageThreat(threat, dmg, source) {
  const tDef = THREAT_TYPES[threat.type];
  threat.hp -= dmg;
  threat.animFlash = 1.0;
  const pos = getThreatPos(threat);
  addFlash(pos.x, pos.y, "#ffffff", 15);
  sfxHit();

  const where = `${ARCS[threat.arc].name}/${ringName(threat.ring)}`;
  if (threat.hp <= 0) {
    threat.hp = 0;
    threat.dying = true;
    threat.animScale = 1.0;
    G.slain++;
    sfxSlain();
    addFlash(pos.x, pos.y, tDef.color, 20);
    log(`${tDef.name} in ${where} SLAIN! (${source})`);
    return true;
  }
  log(`${source} hit ${tDef.name} in ${where} for ${dmg} (${threat.hp}/${threat.maxHp} HP left).`);
  return false;
}

function clickThreat(threatId) {
  if (G.phase !== "play" || selectedCardIdx === null || animating || inputLock) return;
  if (!highlightedTargets.find(t => t.threatId === threatId)) return;

  const idx = selectedCardIdx;
  const card = G.hand[idx];
  const def = CARD_TYPES[card.type];
  const threat = G.threats.find(t => t.id === threatId);
  if (!threat) return;
  const tName = THREAT_TYPES[threat.type].name;

  switch (def.kind) {
    case "hold":
      threat.honeypotted = true;
      log(`Honeypot deployed: ${tName} in ${ARCS[threat.arc].name} will not advance next turn.`);
      break;
    case "push": {
      const oldRing = threat.ring;
      threat.ring = 0;
      threat.animRing = oldRing;
      threat.honeypotted = false;
      log(`Quarantined ${tName} — sent back to the Internet.`);
      break;
    }
    case "slay":
      damageThreat(threat, threat.hp, getCardName(card));
      break;
    case "hit":
      damageThreat(threat, def.damage, getCardName(card));
      break;
  }

  consumeCards([idx], "play");
}

// Harden / Hardware+Config: the player clicked a highlighted firewall slot
function clickFirewall(arcIdx) {
  if (G.phase !== "play" || selectedCardIdx === null || animating || inputLock) return;
  const ft = G.fwTargets;
  if (!ft || !ft.arcs.includes(arcIdx)) return;

  const angle = (arcIdx + 0.5) * ARC_ANGLE - Math.PI / 2;
  const fx = CENTER + Math.cos(angle) * FIREWALL_RADIUS;
  const fy = CENTER + Math.sin(angle) * FIREWALL_RADIUS;

  if (ft.mode === "fortify") {
    G.fortified = arcIdx;
    log(`Firewall in ${ARCS[arcIdx].name} hardened — it now takes 2 hits.`);
    addFlash(fx, fy, "#4ade6a", 20);
    sfxHarden();
    consumeCards([selectedCardIdx], "play");
  } else if (ft.mode === "build") {
    G.firewalls[arcIdx] = 1;
    log(`Firewall in ${ARCS[arcIdx].name} rebuilt!`);
    addFlash(fx, fy, "#4ade6a", 20);
    sfxHarden();
    consumeCards([selectedCardIdx, ft.partnerIdx], "play");
  }
}

// Forensics: pick any card from the discard pile
function showScavengeModal() {
  const content = document.getElementById("modal-content");
  content.dataset.dismissable = "true";
  const items = G.cardDiscard.map((c, i) =>
    `<button class="action-btn" style="font-size:11px;padding:4px 10px;margin:2px;" onclick="pickScavenge(${i})">${getCardName(c)}</button>`
  ).join("");
  content.innerHTML = `
    <h2>Forensics</h2>
    <p style="text-align:center;font-size:11px;margin-bottom:10px;">Recover one card from the discard pile.</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;max-height:50vh;overflow-y:auto;">${items}</div>
    <div class="modal-actions">
      <button class="action-btn" style="opacity:0.7" onclick="closeModal(); deselect(); updateAll();">Cancel</button>
    </div>
  `;
  openModal();
}

function pickScavenge(discardIdx) {
  closeModal();
  if (!G || G.phase !== "play" || selectedCardIdx === null) return;
  const fIdx = selectedCardIdx;
  const forensics = G.hand[fIdx];
  if (!forensics || CARD_TYPES[forensics.type].kind !== "scavenge") return;
  const recovered = G.cardDiscard.splice(discardIdx, 1)[0];
  if (!recovered) return;
  G.hand.push(recovered);
  log(`Forensics recovered ${getCardName(recovered)} from the discard pile.`);
  consumeCards([fIdx], "play");
}

/* ============================================================
   ADVANCE PHASE — every threat moves one step toward the Core
   ============================================================ */
function doAdvancePhase() {
  pendingTimer = null;
  G.phase = "advance";
  updateAll();

  const queue = [];
  queue.push({ type: "log", msg: pick(FLAVOR.advance), delay: 300 });

  // Innermost threats move first, so a Core threat rotates before an Endpoint threat breaches.
  const order = liveThreats().sort((a, b) => b.ring - a.ring || a.id - b.id);
  for (const t of order) queue.push({ type: "move", threatId: t.id, delay: 320 });

  queue.push({ type: "check_lose", delay: 300 });
  queue.push({ type: "callback", fn: doSpawnPhase, delay: 400 });

  enqueueAndProcess(queue);
}

// Resolved at event time so each move sees the board as the previous move left it.
function resolveMove(t) {
  if (t.dying) return;
  const tName = THREAT_TYPES[t.type].name;

  if (t.honeypotted) {
    t.honeypotted = false;
    t.animFlash = 0.8;
    log(`${tName} in ${ARCS[t.arc].name} is stuck in the honeypot — did not advance.`);
    return;
  }

  if (t.ring < 3) {
    t.ring++;
    sfxAdvance();
    return;
  }

  if (t.ring === 3) {
    // At the Endpoint: hit the firewall, then the server, then slip into the Core
    if (G.firewalls[t.arc] || G.servers[t.arc]) { hitStructure(t, t.arc, false); return; }
    t.ring = CORE_RING;
    sfxAdvance();
    log(`${tName} slipped into the Core through ${ARCS[t.arc].name} — nothing left there to stop it.`);
    return;
  }

  // In the Core: rotate clockwise and hit whatever stands in the next segment
  t.arc = (t.arc + 1) % NUM_ARCS;
  if (G.firewalls[t.arc] || G.servers[t.arc]) hitStructure(t, t.arc, true);
  else log(`${tName} moved through the Core into ${ARCS[t.arc].name}.`);
}

// A threat damages the firewall (or, with no firewall, the server) in an arc,
// and takes 1 damage for doing so — plus any Active Defense bonus.
function hitStructure(t, arc, rotated) {
  const tName = THREAT_TYPES[t.type].name;
  const arcName = ARCS[arc].name;
  const angle = (arc + 0.5) * ARC_ANGLE - Math.PI / 2;
  const fx = CENTER + Math.cos(angle) * FIREWALL_RADIUS;
  const fy = CENTER + Math.sin(angle) * FIREWALL_RADIUS;
  const lead = rotated ? `${tName} rotated and` : tName;

  if (G.firewalls[arc]) {
    if (G.fortified === arc) {
      G.fortified = null;
      addFlash(fx, fy, "#ffaa00", 25);
      sfxHit();
      log(`${lead} hit the hardened firewall in ${arcName} — reinforcement lost, firewall holds.`);
    } else {
      G.firewalls[arc] = 0;
      addFlash(fx, fy, "#ff3333", 25);
      sfxFirewallDestroyed();
      log(`${lead} DESTROYED the firewall in ${arcName}!`);
    }
  } else {
    G.servers[arc] = false;
    const sr = CORE_RADIUS * 0.42;
    addFlash(CENTER + Math.cos(angle) * sr, CENTER + Math.sin(angle) * sr, "#ff0000", 35);
    sfxServerDestroyed();
    log(`${lead} DESTROYED the server in ${arcName}!`);
  }

  const dmg = 1 + (G.diffConfig ? G.diffConfig.activeDef : 0);
  damageThreat(t, dmg, "Active Defense");
}

/* ============================================================
   SPAWN PHASE — draw two tokens (more if a token says so)
   ============================================================ */
function doSpawnPhase() {
  G.phase = "spawn";
  updateAll();

  // Pre-draw every token for this phase so the queue can be built up front.
  // Extra draws granted by tokens simply come off the top next.
  const tokens = [];
  let draws = G.diffConfig ? G.diffConfig.tokensPerSpawn : 2;
  while (draws > 0) {
    const token = drawThreatToken();
    if (!token) break;
    draws--;
    tokens.push(token);
    if (token.kind === "effect") {
      draws += EFFECT_TYPES[token.type].extraDraws || 0;
    } else {
      const d = THREAT_TYPES[token.type];
      if (d.onSpawn === "draw3") draws += 3;
      if (d.onSpawn === "draw4") draws += 4;
    }
  }

  const queue = [];
  queue.push({ type: "log", msg: pick(FLAVOR.spawn), delay: 400 });

  for (const token of tokens) {
    if (token.kind === "effect") {
      const eff = EFFECT_TYPES[token.type];
      queue.push({ type: "effect", msg: `EVENT: ${eff.name} — ${eff.desc}`, flashColor: "#ff6600", delay: 600 });
      queue.push({ type: "callback", fn: () => resolveEffect(token.type), delay: 400 });
      continue;
    }

    // Threat token: roll a segment, place in the Internet ring
    const tDef = THREAT_TYPES[token.type];
    const arc = rollArc();
    const bossMsg = tDef.boss ? ` BOSS: ${tDef.ability}` : "";
    if (tDef.boss && FLAVOR.bossIntro[token.type]) {
      queue.push({ type: "log", msg: FLAVOR.bossIntro[token.type], delay: 400 });
    }
    queue.push({
      type: "spawn_threat",
      threatType: token.type,
      arc: arc,
      msg: `${tDef.name} appeared in ${ARCS[arc].name} (Internet).${bossMsg}`,
      delay: 500,
    });

    if (tDef.onSpawn === "heal") {
      queue.push({ type: "callback", fn: () => {
        let n = 0;
        for (const t of G.threats) {
          if (!t.dying && t.hp < t.maxHp) { t.hp++; t.animFlash = 0.6; n++; }
        }
        log(`Supply Chain compromise: ${n} threat${n === 1 ? "" : "s"} healed 1 HP.`);
        updateAll();
      }, delay: 400 });
    }
  }

  // End-of-spawn checks
  if (G.threatDeck.length === 0) {
    queue.push({ type: "log", msg: "Token deck empty. Survive what's left on the board!", delay: 300 });
  }
  queue.push({ type: "check_lose", delay: 200 });
  queue.push({ type: "check_win", delay: 200 });
  queue.push({ type: "callback", fn: () => {
    if (G.phase === "gameover") return;
    G.turn++;
    log(`=== TURN ${G.turn} ===`);
    if (FLAVOR.milestone[G.turn]) log(FLAVOR.milestone[G.turn]);
    if (G.threatDeck.length === 0 && liveThreats().length > 0) log("Last threats on the field. This is it.");
    doDrawPhase();
  }, delay: 300 });

  enqueueAndProcess(queue);
}

function resolveEffect(type) {
  const eff = EFFECT_TYPES[type];

  if (eff.plagueRing) {
    // Outage: discard every card of that ring (segment-pair and any-segment alike)
    const dropped = G.hand.filter(c => CARD_TYPES[c.type].ring === eff.plagueRing);
    G.hand = G.hand.filter(c => CARD_TYPES[c.type].ring !== eff.plagueRing);
    for (const c of dropped) G.cardDiscard.push(c);
    log(`${eff.name}: discarded ${dropped.length} card${dropped.length === 1 ? "" : "s"}.`);
    screenPulse("#ff6600", 1000);
    deselect();
    updateAll();
    return;
  }

  if (type === "ddos") {
    // Giant Boulder: one segment is scoured — every threat in it dies, then the firewall or server falls
    const arc = rollArc();
    let killed = 0;
    for (const t of G.threats) {
      if (t.dying || t.arc !== arc) continue;
      t.hp = 0; t.dying = true; t.animScale = 1.0; G.slain++; killed++;
      const pos = getThreatPos(t);
      addFlash(pos.x, pos.y, THREAT_TYPES[t.type].color, 20);
    }
    let structure = "";
    if (G.firewalls[arc]) {
      G.firewalls[arc] = 0;
      if (G.fortified === arc) G.fortified = null;
      structure = ", firewall DESTROYED";
    } else if (G.servers[arc]) {
      G.servers[arc] = false;
      structure = ", server DESTROYED";
    }
    log(`DDoS flooded ${ARCS[arc].name}: ${killed} threat${killed === 1 ? "" : "s"} wiped out${structure}!`);
    sfxDDoS();
    screenPulse(structure.includes("server") ? "#ff0000" : "#ff6600", 1200);
    updateAll();
    return;
  }

  if (eff.shift) {
    for (const t of G.threats) {
      if (!t.dying) t.arc = (t.arc + eff.shift + NUM_ARCS) % NUM_ARCS;
    }
    log(`${eff.name}: every threat shifted one segment ${eff.shift > 0 ? "clockwise" : "counter-clockwise"}.`);
    deselect();
    updateAll();
    return;
  }

  if (type === "zeroDay") {
    let count = 0;
    for (const t of G.threats) {
      if (t.ring >= 1 && t.ring < 3 && !t.dying) {
        t.ring++;
        t.animRing = t.ring - 1;
        t.animFlash = 1.0;
        count++;
      }
    }
    log(`ZERO-DAY EXPLOIT: ${count} threat${count === 1 ? "" : "s"} surged forward!`);
    sfxZeroDay();
    screenPulse("#ff0000", 1500);
    updateAll();
  }
  // coordinated & massCampaign are handled by the extra draws in doSpawnPhase
}


/* ============================================================
   RENDERING
   ============================================================ */
function render() {
  ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  ctx.fillStyle = "#05070f";
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  // Draw arc sectors with pair colors, then ring borders
  for (const ring of RINGS) {
    for (let a = 0; a < NUM_ARCS; a++) {
      const startAngle = a * ARC_ANGLE - Math.PI / 2;
      const endAngle = startAngle + ARC_ANGLE;
      const arc = ARCS[a];

      ctx.beginPath();
      ctx.moveTo(CENTER, CENTER);
      ctx.arc(CENTER, CENTER, ring.outer, startAngle, endAngle);
      ctx.lineTo(CENTER, CENTER);
      ctx.closePath();

      // Clip to ring (exclude inner)
      ctx.save();
      ctx.clip();
      // Fill with pair color tint — inner rings slightly brighter
      const alpha = ring.id === 0 ? 0.06 : 0.08 + ring.id * 0.02;
      ctx.fillStyle = adjustAlpha(arc.pairColor, alpha);
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      ctx.restore();

      // Clear the inner hole for non-outermost rings
      if (ring.inner > 0) {
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(CENTER, CENTER, ring.inner, startAngle, endAngle);
        ctx.lineTo(CENTER, CENTER);
        ctx.closePath();
        // Don't actually cut — just redraw background
        ctx.restore();
      }
    }

    // Ring border circle
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, ring.outer, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(71, 96, 156, 0.55)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Core circle
  ctx.beginPath();
  ctx.arc(CENTER, CENTER, CORE_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(13, 20, 36, 0.85)";
  ctx.fill();
  ctx.strokeStyle = "rgba(71, 96, 156, 0.9)";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Arc dividers — thicker between pairs, thinner within pairs
  for (let a = 0; a < NUM_ARCS; a++) {
    const angle = a * ARC_ANGLE - Math.PI / 2;
    const isBoundary = (a % 2 === 0); // pair boundaries at 0, 2, 4
    ctx.beginPath();
    ctx.moveTo(CENTER, CENTER);
    ctx.lineTo(CENTER + Math.cos(angle) * RINGS[0].outer, CENTER + Math.sin(angle) * RINGS[0].outer);
    ctx.strokeStyle = isBoundary ? "rgba(71, 96, 156, 0.7)" : "rgba(71, 96, 156, 0.25)";
    ctx.lineWidth = isBoundary ? 1.5 : 0.5;
    ctx.stroke();
  }

  // Ring labels — along the DMZ/Web separator line, offset above it
  ctx.font = "9px 'Courier New', monospace";
  ctx.fillStyle = "rgba(154, 165, 198, 0.5)";
  ctx.textAlign = "center";
  const sepAngle = 1 * ARC_ANGLE - Math.PI / 2; // DMZ/Web boundary angle
  const perpOffset = -8; // pixels above the line (negative = CCW side)
  for (const ring of RINGS) {
    const midR = (ring.outer + ring.inner) / 2;
    const lx = CENTER + Math.cos(sepAngle) * midR + Math.cos(sepAngle - Math.PI/2) * perpOffset;
    const ly = CENTER + Math.sin(sepAngle) * midR + Math.sin(sepAngle - Math.PI/2) * perpOffset;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(sepAngle);
    ctx.fillText(ring.name.toUpperCase(), 0, 0);
    ctx.restore();
  }

  // Draw text curved along an arc
  function drawCurvedText(text, cx, cy, radius, centerAngle, fontSize, color, letterSpacing) {
    ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const charWidth = fontSize * 0.62;
    const totalWidth = text.length * (charWidth + (letterSpacing || 0));
    const angleSpan = totalWidth / radius;

    // Determine if text is on the bottom half — if so, flip it to read right-side up
    const normAngle = ((centerAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const flip = normAngle > 0.05 && normAngle < Math.PI - 0.05;

    if (flip) {
      // Bottom half: draw on inner side, reversed character order so it reads L-to-R
      const startAngle = centerAngle + angleSpan / 2;
      for (let i = 0; i < text.length; i++) {
        const charAngle = startAngle - (i + 0.5) * (angleSpan / text.length);
        const px = cx + Math.cos(charAngle) * radius;
        const py = cy + Math.sin(charAngle) * radius;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(charAngle - Math.PI / 2);
        ctx.fillText(text[i], 0, 0);
        ctx.restore();
      }
    } else {
      // Top half: normal draw
      const startAngle = centerAngle - angleSpan / 2;
      for (let i = 0; i < text.length; i++) {
        const charAngle = startAngle + (i + 0.5) * (angleSpan / text.length);
        const px = cx + Math.cos(charAngle) * radius;
        const py = cy + Math.sin(charAngle) * radius;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(charAngle + Math.PI / 2);
        ctx.fillText(text[i], 0, 0);
        ctx.restore();
      }
    }
  }

  // Pair labels — outside the board, curved along outer edge
  for (let p = 0; p < 3; p++) {
    const [a1] = SEGMENT_PAIRS[p];
    const midAngle = (a1 + 1) * ARC_ANGLE - Math.PI / 2;
    const r = RINGS[0].outer + 16;
    drawCurvedText(PAIR_NAMES[p], CENTER, CENTER, r, midAngle, 12, adjustAlpha(ARCS[a1].pairColor, 0.8), 1);
  }

  // Individual arc names — inside the Internet ring, curved
  for (let a = 0; a < NUM_ARCS; a++) {
    const angle = (a + 0.5) * ARC_ANGLE - Math.PI / 2;
    const r = (RINGS[0].outer + RINGS[0].inner) / 2 + 2;
    drawCurvedText(ARCS[a].name, CENTER, CENTER, r, angle, 10, adjustAlpha(ARCS[a].color, 0.5), 0);
  }

  if (!G) return;

  // Draw firewalls
  for (let a = 0; a < NUM_ARCS; a++) {
    const angle = (a + 0.5) * ARC_ANGLE - Math.PI / 2;
    const x = CENTER + Math.cos(angle) * FIREWALL_RADIUS;
    const y = CENTER + Math.sin(angle) * FIREWALL_RADIUS;
    if (G.firewalls[a]) {
      // Firewall icon — brick wall with 3D side panel
      const fw = 20, fh = 22, sd = 6;
      const damaged = false;
      const fwStroke = damaged ? "#ddaa00" : "#4ade6a";
      const fwFill = damaged ? "rgba(200, 160, 0, 0.2)" : "rgba(74, 222, 106, 0.2)";
      const fwSideFill = damaged ? "rgba(160, 130, 0, 0.15)" : "rgba(52, 170, 80, 0.15)";
      const fwSideStroke = damaged ? "#bb8800" : "#34aa50";
      const fwTopFill = damaged ? "rgba(180, 140, 0, 0.12)" : "rgba(60, 195, 92, 0.12)";
      ctx.save();
      ctx.translate(x, y);

      // Front face — brick wall
      ctx.fillStyle = fwFill;
      ctx.fillRect(-fw/2, -fh/2, fw, fh);
      ctx.strokeStyle = fwStroke;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-fw/2, -fh/2, fw, fh);

      // Horizontal mortar lines (4 rows of bricks)
      ctx.lineWidth = 0.8;
      const rows = 4;
      const rh = fh / rows;
      for (let r = 1; r < rows; r++) {
        ctx.beginPath();
        ctx.moveTo(-fw/2, -fh/2 + r * rh);
        ctx.lineTo(fw/2, -fh/2 + r * rh);
        ctx.stroke();
      }
      // Vertical mortar — staggered per row
      for (let r = 0; r < rows; r++) {
        const ry = -fh/2 + r * rh;
        const offset = (r % 2 === 0) ? 0 : fw/4;
        ctx.beginPath();
        for (let vx = -fw/2 + fw/2 + offset; vx < fw/2; vx += fw/2) {
          ctx.moveTo(vx, ry);
          ctx.lineTo(vx, ry + rh);
        }
        if (r % 2 !== 0) {
          ctx.moveTo(-fw/2 + fw/4, ry);
          ctx.lineTo(-fw/2 + fw/4, ry + rh);
          ctx.moveTo(-fw/2 + 3*fw/4, ry);
          ctx.lineTo(-fw/2 + 3*fw/4, ry + rh);
        } else {
          ctx.moveTo(0, ry);
          ctx.lineTo(0, ry + rh);
        }
        ctx.stroke();
      }

      // 3D side panel (right side, slight depth)
      ctx.fillStyle = fwSideFill;
      ctx.strokeStyle = fwSideStroke;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(fw/2, -fh/2);
      ctx.lineTo(fw/2 + sd, -fh/2 - sd/2);
      ctx.lineTo(fw/2 + sd, fh/2 - sd/2);
      ctx.lineTo(fw/2, fh/2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 3D top panel
      ctx.fillStyle = fwTopFill;
      ctx.beginPath();
      ctx.moveTo(-fw/2, -fh/2);
      ctx.lineTo(-fw/2 + sd, -fh/2 - sd/2);
      ctx.lineTo(fw/2 + sd, -fh/2 - sd/2);
      ctx.lineTo(fw/2, -fh/2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Hardened firewall — extra outline plus a "2" badge
      if (G.fortified === a) {
        ctx.strokeStyle = "#dbe4fb";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([2, 2]);
        ctx.strokeRect(-fw/2 - 4, -fh/2 - 4, fw + 8, fh + 8);
        ctx.setLineDash([]);
        ctx.fillStyle = "#dbe4fb";
        ctx.font = "bold 9px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("x2", 0, fh/2 + 9);
      }

      ctx.restore();
    } else {
      // Destroyed firewall — dashed outline with X
      const fw = 20, fh = 22;
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "rgba(255, 51, 51, 0.25)";
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(-fw/2, -fh/2, fw, fh);
      ctx.setLineDash([]);
      ctx.strokeStyle = "rgba(255, 51, 51, 0.4)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-fw/2 + 3, -fh/2 + 3); ctx.lineTo(fw/2 - 3, fh/2 - 3);
      ctx.moveTo(fw/2 - 3, -fh/2 + 3); ctx.lineTo(-fw/2 + 3, fh/2 - 3);
      ctx.stroke();
      ctx.restore();

    }
  }

  // Firewall-slot highlights for Harden / Hardware+Config
  if (G.fwTargets) {
    for (const a of G.fwTargets.arcs) {
      const angle = (a + 0.5) * ARC_ANGLE - Math.PI / 2;
      const x = CENTER + Math.cos(angle) * FIREWALL_RADIUS;
      const y = CENTER + Math.sin(angle) * FIREWALL_RADIUS;
      ctx.beginPath();
      ctx.arc(x, y, 24, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(84, 242, 255, 0.8)";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(x, y, 24, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(84, 242, 255, 0.08)";
      ctx.fill();
    }
  }

  // Draw servers (database cylinder — stacked ovals)
  for (let a = 0; a < NUM_ARCS; a++) {
    const angle = (a + 0.5) * ARC_ANGLE - Math.PI / 2;
    const r = CORE_RADIUS * 0.42;
    const x = CENTER + Math.cos(angle) * r;
    const y = CENTER + Math.sin(angle) * r;
    const w = 12, h = 20, ov = 5; // half-width, total height, oval ry

    if (G.servers[a]) {
      ctx.strokeStyle = "#dbe4fb";
      ctx.lineWidth = 2;

      // Solid cylinder — bottom hidden, only front visible
      // 1. Fill body rectangle (covers everything between top and bottom)
      ctx.fillStyle = "#273249";
      ctx.fillRect(x - w, y - h/2, w * 2, h);

      // 2. Cover bottom with solid fill (flat bottom, no visible ellipse)
      ctx.beginPath();
      ctx.ellipse(x, y + h/2, w, ov, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#273249";
      ctx.fill();

      // 3. Side lines
      ctx.beginPath();
      ctx.moveTo(x - w, y - h/2); ctx.lineTo(x - w, y + h/2);
      ctx.moveTo(x + w, y - h/2); ctx.lineTo(x + w, y + h/2);
      ctx.stroke();

      // 4. Bottom edge (front arc only — just the visible curve)
      ctx.beginPath();
      ctx.ellipse(x, y + h/2, w, ov, 0, 0, Math.PI);
      ctx.stroke();

      // 5. Two tier lines (front arcs)
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(x, y - h * 0.15, w, ov, 0, 0, Math.PI);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x, y + h * 0.15, w, ov, 0, 0, Math.PI);
      ctx.stroke();

      // 6. Top cap — brightest, full ellipse
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x, y - h/2, w, ov, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#47609c";
      ctx.fill();
      ctx.stroke();
    } else {
      // Destroyed — dashed outline
      const bodyColor = "rgba(100, 30, 30, 0.25)";
      ctx.fillStyle = bodyColor;
      ctx.strokeStyle = "rgba(255, 51, 51, 0.25)";
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.ellipse(x, y - h/2, w, ov, 0, Math.PI, Math.PI * 2);
      ctx.lineTo(x + w, y + h/2);
      ctx.ellipse(x, y + h/2, w, ov, 0, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x, y - h/2, w, ov, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      // X
      ctx.strokeStyle = "rgba(255, 51, 51, 0.4)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - w + 2, y - h/2); ctx.lineTo(x + w - 2, y + h/2);
      ctx.moveTo(x + w - 2, y - h/2); ctx.lineTo(x - w + 2, y + h/2);
      ctx.stroke();
    }
  }

  // Highlighted valid targets — much larger hit area
  for (const ht of highlightedTargets) {
    const threat = G.threats.find(t => t.id === ht.threatId);
    if (!threat) continue;
    const pos = getThreatPos(threat);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 28, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(84, 242, 255, 0.8)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    // Clickable area fill
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 28, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(84, 242, 255, 0.08)";
    ctx.fill();
  }

  // Draw threats
  for (const t of G.threats) {
    drawThreat(t);
  }

  // Flash effects
  for (const f of flashEffects) {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius * (1 + (1 - f.life) * 0.5), 0, Math.PI * 2);
    ctx.fillStyle = adjustAlpha(f.color, f.life * 0.4);
    ctx.fill();
  }
}

function getThreatPos(t) {
  const angle = (t.arc + 0.5) * ARC_ANGLE - Math.PI / 2;
  const displayRing = t.animRing !== undefined ? t.animRing : t.ring;
  let r;
  if (displayRing <= 3) {
    // Interpolate between ring positions
    const ringIdx = Math.floor(Math.max(0, Math.min(3, displayRing)));
    const frac = displayRing - ringIdx;
    const ring1 = RINGS[ringIdx];
    const r1 = (ring1.outer + ring1.inner) / 2;
    if (frac > 0.01 && ringIdx < 3) {
      const ring2 = RINGS[ringIdx + 1];
      const r2 = (ring2.outer + ring2.inner) / 2;
      r = r1 + (r2 - r1) * frac;
    } else {
      r = r1;
    }
  } else {
    r = CORE_RADIUS * 0.68;
  }
  // Offset if multiple threats in same position — spread along the arc
  const samePos = G.threats.filter(o => o.ring === t.ring && o.arc === t.arc && o.id < t.id && !o.dying).length;
  if (samePos > 0) {
    // Offset along the arc (angular offset) rather than perpendicular
    const angularSpread = 0.12; // radians per stacked threat
    const offsetDir = samePos % 2 === 0 ? 1 : -1;
    const offsetIdx = Math.ceil(samePos / 2);
    const adjustedAngle = angle + angularSpread * offsetIdx * offsetDir;
    return {
      x: CENTER + Math.cos(adjustedAngle) * r,
      y: CENTER + Math.sin(adjustedAngle) * r,
    };
  }

  return {
    x: CENTER + Math.cos(angle) * r,
    y: CENTER + Math.sin(angle) * r,
  };
}

function drawPolygon(cx, cy, r, sides, rotation) {
  // sides=0 means circle
  if (sides === 0) {
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    return;
  }
  const rot = rotation || -Math.PI / 2; // point up by default
  for (let i = 0; i <= sides; i++) {
    const angle = rot + (i * Math.PI * 2) / sides;
    const px = cx + Math.cos(angle) * r;
    const py = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
}

function drawThreat(t) {
  const tDef = THREAT_TYPES[t.type];
  const pos = getThreatPos(t);
  const scale = t.animScale !== undefined ? Math.max(0, t.animScale) : 1;
  if (scale <= 0) return;

  const r = (tDef.boss ? 22 : 18) * scale * (t.ring === CORE_RING ? 0.7 : 1);
  const sides = tDef.sides;
  // Diamond rotated 45 degrees looks better
  const rotation = sides === 4 ? 0 : -Math.PI / 2;

  ctx.save();
  ctx.globalAlpha = Math.min(1, scale + 0.2);

  // Shape fill
  ctx.beginPath();
  drawPolygon(pos.x, pos.y, r, sides, rotation);
  ctx.closePath();
  ctx.fillStyle = adjustAlpha(tDef.color, 0.3);
  ctx.fill();
  ctx.strokeStyle = tDef.color;
  ctx.lineWidth = tDef.boss ? 2.5 : 1.5;
  ctx.stroke();

  // Flash overlay
  if (t.animFlash > 0) {
    ctx.beginPath();
    drawPolygon(pos.x, pos.y, r + 3, sides, rotation);
    ctx.closePath();
    ctx.fillStyle = `rgba(255, 255, 255, ${t.animFlash * 0.5})`;
    ctx.fill();
  }

  // Glyph
  if (scale > 0.4) {
    const fontSize = Math.round((tDef.boss ? 13 : 11) * scale);
    ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
    ctx.fillStyle = tDef.color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(tDef.glyph, pos.x, pos.y - 1 * scale);

    // HP dots below the shape
    const dotR = 3 * scale;
    const dotY = pos.y + r + dotR + 3 * scale;
    const totalW = (t.maxHp - 1) * (dotR * 2.5);
    const startX = pos.x - totalW / 2;
    for (let i = 0; i < t.maxHp; i++) {
      const dx = startX + i * dotR * 2.5;
      ctx.beginPath();
      ctx.arc(dx, dotY, dotR, 0, Math.PI * 2);
      if (i < t.hp) {
        // Filled dot = remaining HP
        ctx.fillStyle = t.hp === t.maxHp ? tDef.color : (t.hp === 1 ? "#ff3333" : "#ffb000");
        ctx.fill();
      } else {
        // Empty dot = lost HP
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  // Honeypot indicator
  if (t.honeypotted) {
    ctx.font = `bold ${Math.round(8 * scale)}px 'Courier New', monospace`;
    ctx.fillStyle = "#dbe4fb";
    ctx.textAlign = "center";
    ctx.fillText("\u2691", pos.x + r + 6, pos.y); // flag icon
  }

  ctx.restore();
}

function adjustAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ============================================================
   CLICK HANDLING
   ============================================================ */
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  // Account for object-fit: contain letterboxing
  const canvasAspect = canvas.width / canvas.height; // 1:1
  const rectAspect = rect.width / rect.height;
  let renderW, renderH, offsetX, offsetY;
  if (rectAspect > canvasAspect) {
    // Wider than tall — letterboxed on sides
    renderH = rect.height;
    renderW = rect.height * canvasAspect;
    offsetX = (rect.width - renderW) / 2;
    offsetY = 0;
  } else {
    // Taller than wide — letterboxed on top/bottom
    renderW = rect.width;
    renderH = rect.width / canvasAspect;
    offsetX = 0;
    offsetY = (rect.height - renderH) / 2;
  }

  return {
    x: ((e.clientX - rect.left - offsetX) / renderW) * CANVAS_SIZE,
    y: ((e.clientY - rect.top - offsetY) / renderH) * CANVAS_SIZE,
  };
}

function modalOpen() {
  return document.getElementById("modal-overlay").classList.contains("active");
}

function setupInput() {
  canvas.addEventListener("click", (e) => {
    if (!G || G.phase !== "play" || selectedCardIdx === null || animating || inputLock) return;
    const { x, y } = getCanvasCoords(e);

    // Firewall targeting (Harden, Hardware + Config)
    if (G.fwTargets && G.fwTargets.arcs.length > 0) {
      for (const arcIdx of G.fwTargets.arcs) {
        const angle = (arcIdx + 0.5) * ARC_ANGLE - Math.PI / 2;
        const fx = CENTER + Math.cos(angle) * FIREWALL_RADIUS;
        const fy = CENTER + Math.sin(angle) * FIREWALL_RADIUS;
        if (Math.hypot(x - fx, y - fy) < 30) {
          clickFirewall(arcIdx);
          return;
        }
      }
      return; // clicked elsewhere, ignore
    }

    // Threat targeting — only consider valid targets
    if (highlightedTargets.length === 0) return;
    for (const ht of highlightedTargets) {
      const t = G.threats.find(th => th.id === ht.threatId);
      if (!t || t.dying) continue;
      const pos = getThreatPos(t);
      if (Math.hypot(x - pos.x, y - pos.y) < 30) {
        clickThreat(t.id);
        return;
      }
    }
  });

  // Keyboard
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (modalOpen()) {
        const content = document.getElementById("modal-content");
        if (content.dataset.dismissable === "true") { closeModal(); deselect(); if (G) updateAll(); }
        return;
      }
      deselect();
      if (G) updateAll();
      return;
    }
    if (e.key === "h" || e.key === "H") {
      if (modalOpen() && document.getElementById("modal-content").dataset.help === "true") closeModal();
      else if (!modalOpen()) showHowToPlay();
      return;
    }
    if (modalOpen()) return; // never let game keys through a dialog
    if (e.key === "m" || e.key === "M") { toggleMute(); return; }
    if (!G) return;

    // Number keys select cards (hand can grow past 6 via Threat Intel)
    const num = parseInt(e.key);
    if (num >= 1 && num <= 9 && num <= G.hand.length) {
      selectCard(num - 1);
      return;
    }

    // Enter/Space
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (G.phase === "discard") skipDiscard();
      else if (G.phase === "play") endPlayPhase();
    }
  });
}

/* ============================================================
   UI UPDATES
   ============================================================ */
function updateAll() {
  if (!G) return;
  render();
  updateHUD();
  updateHand();
  updatePhaseUI();
  updateCanvasLabel();
}

function updateCanvasLabel() {
  const c = document.getElementById("game-canvas");
  if (!c || !G) return;
  const threats = liveThreats().length;
  const servers = G.servers.filter(Boolean).length;
  const fws = G.firewalls.filter(f => f > 0).length;
  c.setAttribute("aria-label",
    `Network defense board. Turn ${G.turn}. ${threats} threats on board. ${servers} of 6 servers intact. ${fws} of 6 firewalls intact. Phase: ${G.phase}.`
  );
}

let prevHUDState = {};
function updateHUD() {
  const stats = {
    turn: G.turn,
    tokens: G.threatDeck.length,
    servers: G.servers.filter(Boolean).length,
    slain: G.slain,
  };

  function flashStat(id, cls) {
    const el = document.getElementById(id);
    el.classList.remove("flash", "flash-red");
    void el.offsetWidth; // force reflow
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 600);
  }

  document.getElementById("stat-turn").textContent = stats.turn;
  document.getElementById("stat-threats").textContent = stats.tokens;
  document.getElementById("stat-servers").textContent = stats.servers + "/6";
  document.getElementById("stat-slain").textContent = stats.slain;

  // Flash on change
  if (prevHUDState.slain !== undefined && stats.slain > prevHUDState.slain) flashStat("stat-slain", "flash");
  if (prevHUDState.servers !== undefined && stats.servers < prevHUDState.servers) flashStat("stat-servers", "flash-red");
  if (prevHUDState.turn !== undefined && stats.turn > prevHUDState.turn) flashStat("stat-turn", "flash");

  prevHUDState = { ...stats };
}

function cardSortKey(card) {
  const def = CARD_TYPES[card.type];
  // Segment group: specials first, then any-segment ring cards, then the three pairs
  let seg;
  if (def.segment === "pair") seg = 2 + (card.pairIdx || 0);
  else if (def.segment === "any" && typeof def.ring === "number") seg = 1;
  else seg = 0;
  // Within a group: any-ring first, then Endpoint, Network, Perimeter (most urgent first)
  const ringOrder = { 3: 1, 2: 2, 1: 3 };
  const ring = typeof def.ring === "number" ? (ringOrder[def.ring] || 0) : 0;
  return seg * 10 + ring;
}

function updateHand() {
  const container = document.getElementById("card-hand");
  container.classList.toggle("discard-phase", G.phase === "discard");

  // FLIP Step 1 (FIRST): snapshot existing card positions
  const oldPositions = new Map();
  container.querySelectorAll(".card[data-card-id]").forEach(el => {
    const uid = el.dataset.cardId;
    const rect = el.getBoundingClientRect();
    oldPositions.set(uid, { top: rect.top, left: rect.left });
  });

  // Rebuild DOM
  container.innerHTML = "";

  const segBadgeClass = ["badge-dmzweb", "badge-corpeng", "badge-finexec"];

  // Build sorted indices
  const indices = G.hand.map((_, i) => i);
  indices.sort((a, b) => cardSortKey(G.hand[a]) - cardSortKey(G.hand[b]));

  let newCardStagger = 0;

  for (const i of indices) {
    const card = G.hand[i];
    const def = CARD_TYPES[card.type];

    const el = document.createElement("div");
    el.className = "card";
    el.dataset.cardId = card._uid;
    if (i === selectedCardIdx) el.classList.add("selected");
    if (def.kind === "dead") {
      if (G.phase === "discard") el.classList.add("misconfig-discard");
      else el.classList.add("disabled");
    }
    // The partner of a selected build card is shown as selected too
    if (G.fwTargets && G.fwTargets.mode === "build" && i === G.fwTargets.partnerIdx) el.classList.add("selected");

    // Ring badge
    let ringBadge = "";
    if (def.ring === 1) ringBadge = `<span class="card-badge badge-perimeter">◎ Perimeter</span>`;
    else if (def.ring === 2) ringBadge = `<span class="card-badge badge-network">◎ Network</span>`;
    else if (def.ring === 3) ringBadge = `<span class="card-badge badge-endpoint">◎ Endpoint+Core</span>`;
    else if (def.ring === "any") ringBadge = `<span class="card-badge badge-any-ring">◎ Any Ring</span>`;
    else if (def.ring === "outer") ringBadge = `<span class="card-badge badge-any-ring">◎ Outer Rings</span>`;
    else if (def.kind !== "dead") ringBadge = `<span class="card-badge badge-special">☆ Special</span>`;

    // Segment badge
    let segBadge = "";
    if (def.segment === "pair" && card.pairIdx !== undefined) {
      segBadge = `<span class="card-badge ${segBadgeClass[card.pairIdx]}">■ ${PAIR_NAMES[card.pairIdx]}</span>`;
    } else if (def.segment === "any" && typeof def.ring === "number") {
      segBadge = `<span class="card-badge badge-segment">■ Any Segment</span>`;
    }

    // Card description
    const descText = def.kind === "dead"
      ? `<span class="card-desc" style="color:var(--red)">${def.desc}</span>`
      : `<span class="card-desc">${def.desc}</span>`;

    el.innerHTML = `
      <span class="card-key">${i + 1}</span>
      <span class="card-name">${def.name}</span>
      <div class="card-badges">${ringBadge}${segBadge}</div>
      ${descText}
    `;
    el.title = def.desc;

    // Only animate entry for NEW cards (not previously in DOM)
    const uidStr = String(card._uid);
    if (!oldPositions.has(uidStr)) {
      el.classList.add("card-enter");
      el.style.animationDelay = (newCardStagger * 60) + "ms";
      newCardStagger++;
    }

    el.addEventListener("click", () => selectCard(i));
    container.appendChild(el);
  }

  // FLIP Step 2 (LAST + INVERT + PLAY): animate surviving cards to new positions
  requestAnimationFrame(() => {
    container.querySelectorAll(".card[data-card-id]").forEach(el => {
      const uid = el.dataset.cardId;
      if (!oldPositions.has(uid)) return; // new card, handled by card-enter

      const oldPos = oldPositions.get(uid);
      const newRect = el.getBoundingClientRect();
      const deltaX = oldPos.left - newRect.left;
      const deltaY = oldPos.top - newRect.top;

      if (Math.abs(deltaX) < 1 && Math.abs(deltaY) < 1) return; // no movement

      // INVERT: jump to old position
      el.style.transition = "none";
      el.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

      // PLAY: animate to new position
      requestAnimationFrame(() => {
        el.style.transition = "transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)";
        el.style.transform = "";

        // Clean up inline styles after animation
        el.addEventListener("transitionend", function cleanup(e) {
          if (e.propertyName === "transform") {
            el.style.transition = "";
            el.style.transform = "";
            el.removeEventListener("transitionend", cleanup);
          }
        });
      });
    });
  });

  // Action buttons
  const actions = document.getElementById("hand-actions");
  actions.innerHTML = "";
  if (G.phase === "discard") {
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = "Skip Discard";
    btn.onclick = skipDiscard;
    actions.appendChild(btn);
  } else if (G.phase === "play") {
    const btn = document.createElement("button");
    btn.className = "action-btn primary";
    btn.textContent = "End Play Phase";
    btn.onclick = endPlayPhase;
    actions.appendChild(btn);
  }
}

let prevPhase = null;
function updatePhaseUI() {
  const display = document.getElementById("phase-display");
  const instr = document.getElementById("phase-instructions");

  const phases = {
    draw: ["Draw Phase", "Drawing cards to fill your hand..."],
    discard: ["Discard Phase", "Click one card to discard it and draw a replacement, or click Skip Discard."],
    play: ["Play Phase", "Click a card, then click a highlighted threat or firewall on the board. Click End Play Phase when done."],
    advance: ["Threats Advancing", "Every threat moves 1 ring closer to your servers..."],
    spawn: ["Drawing Tokens", "New threats are emerging from the Internet..."],
    gameover: ["Game Over", ""],
  };

  const [name, instructions] = phases[G.phase] || ["", ""];
  display.textContent = `Turn ${G.turn} — ${name}`;
  instr.textContent = instructions;

  // Animate phase change
  if (prevPhase !== G.phase) {
    display.classList.remove("phase-change", "phase-danger");
    void display.offsetWidth;
    display.classList.add("phase-change");
    if (G.phase === "advance" || G.phase === "spawn") display.classList.add("phase-danger");
    sfxPhaseChange();
    // No banner for the token draw: it is over in a moment and needs nothing from the player
    if (name && G.phase !== "gameover" && G.phase !== "spawn") showPhaseToast(name, G.phase === "advance");
    prevPhase = G.phase;
  }
}

// Brief centered banner over the board naming the phase just entered.
let _phaseToastTimer = null;
function showPhaseToast(text, danger) {
  const el = document.getElementById("phase-toast");
  if (!el) return;
  if (_phaseToastTimer) clearTimeout(_phaseToastTimer);
  el.textContent = text;
  el.classList.remove("active", "danger");
  if (danger) el.classList.add("danger");
  void el.offsetWidth; // restart the animation
  el.classList.add("active");
  _phaseToastTimer = setTimeout(() => { el.classList.remove("active"); _phaseToastTimer = null; }, 900);
}

function getCardName(card) {
  const def = CARD_TYPES[card.type];
  if (def.segment === "pair" && card.pairIdx !== undefined) {
    return `${def.name} [${PAIR_NAMES[card.pairIdx]}]`;
  }
  return def.name;
}

function log(msg, level) {
  if (G) G.log.push(msg);

  // Auto-detect level from message content if not specified
  if (!level) {
    if (/DESTROYED|BREACH|ZERO-DAY|DDoS|slipped into the Core/i.test(msg)) level = "danger";
    else if (/BOSS|Ransomware|Nation State|surged|Coordinated|Mass Campaign|EVENT:|Outage|Lateral/i.test(msg)) level = "warn";
    else if (/SLAIN|rebuilt|hardened|Quarantined|recovered|holds/i.test(msg)) level = "good";
  }

  const list = document.getElementById("log-list");
  if (list) {
    const li = document.createElement("li");
    li.textContent = msg;
    if (level) li.classList.add("log-" + level);
    list.insertBefore(li, list.firstChild);
    while (list.children.length > 50) list.removeChild(list.lastChild);
  }

  const ann = document.getElementById("announcements");
  ann.textContent = msg;
}

        <ul>
          <li>Don't waste flexible cards on 1 HP Script Kiddies if a basic card will do</li>
          <li>A threat at the Endpoint takes damage for every firewall or server it breaks. Sometimes letting a firewall fall finishes it off</li>
          <li>Save the Honeypot for a boss or a threat about to hit a server</li>
          <li>Hold Hardware and Config together. Neither does anything alone</li>
          <li>Quarantine buys three turns: the threat has to walk back in from the Internet</li>
          <li>Forensics can fetch back a card you had to discard to an Outage</li>
          <li>Watch the Tokens Left counter. When it hits 0, you just need to clear the board</li>
        </ul>
      </div>
    </div>

    <!-- ABOUT TAB -->
    <div class="${panelCls("about")}">
      <div style="text-align:center;padding:40px 20px;">
        <p style="font-size:14px;color:var(--accent);margin-bottom:16px;">PumaPanic</p>
        <p style="font-size:12px;margin-bottom:8px;">Cyber Tower Defense</p>
        <p style="margin-bottom:24px;">Built by <a href="https://www.greykit.com" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">greykit.com</a></p>
        <p style="font-size:10px;color:var(--text-dim);">Inspired by Castle Panic by Justin De Witt / Fireside Games</p>
      </div>
    </div>

    <div class="modal-actions">
      <button class="action-btn" onclick="${closeAction}">${G ? "Close" : "Back"}</button>
    </div>
  `;
  openModal();
}

function showGameOver(won) {
  if (won) sfxWin(); else sfxLose();
  const content = document.getElementById("modal-content");
  content.dataset.dismissable = "false";
  content.dataset.help = "false";
  const serversLeft = G.servers.filter(Boolean).length;
  const fwLeft = G.firewalls.filter(f => f > 0).length;
  const score = G.slain * 10 + serversLeft * 50 + fwLeft * 20 + (won ? 200 : 0) - G.turn * 2;
  let grade = "F";
  if (won) grade = serversLeft === 6 ? "S" : serversLeft >= 5 ? "A" : serversLeft >= 3 ? "B" : "C";
  content.innerHTML = `
    <h2>${won ? "NETWORK SECURED" : "NETWORK COMPROMISED"}</h2>
    <p style="text-align:center;font-size:14px;color:${won ? 'var(--green)' : 'var(--red)'};">
      ${won ? pick(FLAVOR.win) : pick(FLAVOR.lose)}
    </p>
    <p>Threats slain: ${G.slain}</p>
    <p>Servers remaining: ${serversLeft}/6</p>
    <p>Firewalls remaining: ${fwLeft}/6</p>
    <p>Turns taken: ${G.turn}</p>
    <p style="font-size:18px;color:var(--accent);text-align:center;margin-top:12px;">
      Score: ${Math.max(0, score)} — Grade: ${grade}
    </p>
    <div class="modal-actions">
      <button class="action-btn" onclick="closeModal(); newGame();">Play Again</button>
      <button class="action-btn" style="opacity:0.7" onclick="closeModal(); showMainMenu();">Main Menu</button>
    </div>
  `;
  openModal();
}

let _prevFocus = null;
let _trapHandler = null;
function closeModal() {
  document.getElementById("modal-overlay").classList.remove("active");
  if (_trapHandler) {
    document.getElementById("modal-content").removeEventListener("keydown", _trapHandler);
    _trapHandler = null;
  }
  if (_prevFocus) { _prevFocus.focus(); _prevFocus = null; }
}

function openModal() {
  if (!modalOpen()) _prevFocus = document.activeElement;
  document.getElementById("modal-overlay").classList.add("active");
  setTimeout(trapFocusInModal, 50);
}

function trapFocusInModal() {
  const modal = document.getElementById("modal-content");
  if (!modal || !modalOpen()) return;
  if (_trapHandler) modal.removeEventListener("keydown", _trapHandler);
  const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  first.focus();

  _trapHandler = function (e) {
    if (e.key !== "Tab") return;
    if (e.shiftKey) {
      if (document.activeElement === first) { e.preventDefault(); last.focus(); }
    } else {
      if (document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };
  modal.addEventListener("keydown", _trapHandler);
}

// Click outside modal content to close (only for help/non-essential modals)
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target === document.getElementById("modal-overlay")) {
    const content = document.getElementById("modal-content");
    if (content && content.dataset.dismissable === "true") {
      closeModal();
      deselect();
      if (G) updateAll();
    }
  }
});

let _newGameConfirmTimer = null;
function newGameClick() {
  const btn = document.getElementById("newgame-btn");
  if (_newGameConfirmTimer) {
    clearTimeout(_newGameConfirmTimer);
    _newGameConfirmTimer = null;
    btn.textContent = "NEW";
    btn.classList.remove("confirm");
    showMainMenu();
  } else {
    btn.textContent = "SURE?";
    btn.classList.add("confirm");
    _newGameConfirmTimer = setTimeout(() => {
      _newGameConfirmTimer = null;
      btn.textContent = "NEW";
      btn.classList.remove("confirm");
    }, 3000);
  }
}

function updateSlider(key, val) {
  const def = SLIDER_DEFS[key];
  const numVal = parseInt(val);
  houseRules[key] = numVal;
  const display = def.labels ? def.labels[numVal - def.min] : numVal + (def.unit || "");
  const el = document.getElementById("slider-val-" + key);
  if (el) el.textContent = display;
}

function applyPreset(presetId) {
  const preset = DIFFICULTY_PRESETS[presetId];
  if (!preset) return;
  houseRules = { ...preset.sliders };
  // Refresh the menu to update slider positions
  showMainMenu();
}

  { title: "Your Cards", text: "Each turn you draw up to a full hand. A card like 'Perimeter Def [DMZ/Web]' can only hit a threat in the Perimeter ring AND in the DMZ or Web Services segment.\n\nCards like Contractor or Incident Commander are more flexible. Hardware and Config only work when played together." },
  { title: "Playing Cards", text: "During the Play phase:\n1. Click a card in your hand to select it\n2. Valid targets glow on the board\n3. Click a threat (or a firewall slot) to play the card\n\nYou can play as many cards as you want, then click 'End Play Phase'." },
  { title: "Firewalls & Servers", text: "6 Firewalls guard the Core. A threat at the Endpoint destroys the firewall in its segment, then the server behind it, taking 1 damage each time.\n\nOnly when nothing is left in its segment does a threat slip into the Core and start circling.\n\nPlay Hardware + Config to rebuild a firewall, and Harden to make one take 2 hits." },
  { title: "Tokens", text: "Each turn 2 tokens are drawn. Most are threats. Some are events:\n- Outage discards a whole ring of cards from your hand\n- DDoS wipes a segment and its firewall\n- Lateral Movement shifts every threat sideways\n- Bosses draw extra tokens or heal the board" },
  { title: "Good Luck!", text: "Clear the token deck and the board with at least 1 server standing to win.\n\nPress H anytime for the full How to Play guide. Press Escape to close dialogs." },

let tutorialStep = 0;
function showTutorial() {
  if (localStorage.getItem("pumapanic_tutorialSeen3")) return;
  localStorage.setItem("pumapanic_tutorialSeen3", "1");
  tutorialStep = 0;
  showTutorialStep();
}
function showTutorialStep() {
  const content = document.getElementById("modal-content");
  content.dataset.dismissable = "false";
  content.dataset.help = "false";
  const step = TUTORIAL_STEPS[tutorialStep];
  content.innerHTML = `
    <h2 style="font-size:14px;">${step.title}</h2>
    <p>${step.text.replace(/\n/g, "<br>")}</p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;">
      <span style="color:var(--text-dim);font-size:10px;">${tutorialStep + 1}/${TUTORIAL_STEPS.length}</span>
      <div style="display:flex;gap:6px;">
        ${tutorialStep > 0 ? '<button class="action-btn" onclick="tutorialStep--;showTutorialStep();" style="font-size:10px;padding:3px 8px;">Back</button>' : ''}
        ${tutorialStep < TUTORIAL_STEPS.length - 1
          ? '<button class="action-btn" onclick="tutorialStep++;showTutorialStep();" style="font-size:10px;padding:3px 8px;">Next</button>'
          : '<button class="action-btn" onclick="closeModal();" style="font-size:10px;padding:3px 8px;">Got it!</button>'}
        <button class="action-btn" onclick="closeModal();" style="font-size:10px;padding:3px 8px;opacity:0.5;">Skip</button>
      </div>
    </div>
  `;
  openModal();
}
