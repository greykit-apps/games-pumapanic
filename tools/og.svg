<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The share card: rendered to og.png by tools/render-icons.sh. Laid out
       as the other Tactical games' cards are: a cyan rule, the wordmark with
       the game's half in cyan, the description, a tagline, the icon. -->
  <rect width="1200" height="630" fill="#05070f"/>
  <rect width="1200" height="8" fill="#54f2ff"/>
  <text x="105" y="148" font-family="Menlo, ui-monospace, monospace" font-size="84" font-weight="700" fill="#e9e9f2">Puma<tspan fill="#54f2ff">Panic</tspan></text>
  <svg x="1000" y="72" width="100" height="100" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#05070f"/>
  
  <rect x="28" y="9" width="25" height="37" rx="3" fill="#0d1424" stroke="#2b7f92" stroke-width="2"/>
  <rect x="11" y="17" width="29" height="41" rx="3.5" fill="#0a0e1a" stroke="#54f2ff" stroke-width="2.5"/>
  <g fill="#54f2ff">
    <rect x="22.5" y="26" width="6" height="16" rx="3"/>
    <circle cx="25.5" cy="49" r="3.4"/>
  </g>
</svg>
  <text y="256" font-family="Menlo, ui-monospace, monospace" font-size="38" fill="#9aa1ae">
    <tspan x="105" dy="0">A cybersecurity tower-defense card</tspan>
    <tspan x="105" dy="54">game. Defend your network from waves</tspan>
    <tspan x="105" dy="54">of cyber threats, turn by turn, with</tspan>
    <tspan x="105" dy="54">the cards in your hand. Inspired by</tspan>
    <tspan x="105" dy="54">Castle Panic.</tspan>
  </text>
  <text x="105" y="588" font-family="Menlo, ui-monospace, monospace" font-size="30" fill="#54f2ff">Cyber tower defense</text>
</svg>
